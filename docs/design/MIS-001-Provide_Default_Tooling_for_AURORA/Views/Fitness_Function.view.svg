<rect class="bg" x="0" y="0" width="100%" height="100%" />
<path class="edge-path" d="M 576.33 816.61 L 646.53 816.61 L 724.23 816.61 L 794.52 816.61" data-tail="CNS-002" data-head="CNS-004" />
<text class="edge-label" x="759.14" y="809.94" text-anchor="middle" dominant-baseline="middle">includes</text>
<g class="node card-type-constraint" data-card-id="CNS-001" data-layout-node="CNS-001">
<rect class="node-shape" x="131.57" y="905.28" width="446.67" height="84.00" rx="6" ry="6" />
<text class="node-label" x="354.90" y="919.28" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan>
<tspan x="354.90" dy="14.00">Text Based Data Format</tspan>
<tspan x="354.90" dy="14.00">&#160;</tspan>
<tspan x="354.90" dy="14.00">In order to remain human readable and editable, the data format</tspan>
<tspan x="354.90" dy="14.00">must be text based.</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-002" data-layout-node="CNS-002">
<rect class="node-shape" x="133.57" y="752.62" width="442.67" height="128.00" rx="6" ry="6" />
<text class="node-label" x="354.90" y="774.61" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan><tspan> (Invariant)</tspan>
<tspan x="354.90" dy="14.00">Directed, Locally Cyclic Graph</tspan>
<tspan x="354.90" dy="14.00">&#160;</tspan>
<tspan x="354.90" dy="14.00">The model must form a Directed Graph in which all paths start</tspan>
<tspan x="354.90" dy="14.00">from a root card (&quot;Mission&quot;) and monotonically increase in</tspan>
<tspan x="354.90" dy="14.00">length until either encountering a card already encountered or</tspan>
<tspan x="354.90" dy="14.00">reaching a leaf card (one with no outgoing links).</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-003" data-layout-node="CNS-003">
<rect class="node-shape" x="139.57" y="629.94" width="430.67" height="98.67" rx="6" ry="6" />
<text class="node-label" x="354.90" y="644.28" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan>
<tspan x="354.90" dy="14.00">No Inherent Semantic Meaning</tspan>
<tspan x="354.90" dy="14.00">&#160;</tspan>
<tspan x="354.90" dy="14.00">The nodes and edges of the model must not carry any semantic</tspan>
<tspan x="354.90" dy="14.00">meaning; semantic meaning is imposed when interpreted for some</tspan>
<tspan x="354.90" dy="14.00">use, such as generating views.</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-004" data-layout-node="CNS-004">
<rect class="node-shape" x="808.45" y="774.61" width="417.33" height="84.00" rx="6" ry="6" />
<text class="node-label" x="1017.12" y="788.61" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan>
<tspan x="1017.12" dy="14.00">No Orphans</tspan>
<tspan x="1017.12" dy="14.00">&#160;</tspan>
<tspan x="1017.12" dy="14.00">All cards other than `Mission` must have at least one</tspan>
<tspan x="1017.12" dy="14.00">incoming link.</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-005" data-layout-node="CNS-005">
<rect class="node-shape" x="136.23" y="507.28" width="437.34" height="98.67" rx="6" ry="6" />
<text class="node-label" x="354.90" y="521.62" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan><tspan> (Graphviz)</tspan>
<tspan x="354.90" dy="14.00">Graphviz DOT View Conventions</tspan>
<tspan x="354.90" dy="14.00">&#160;</tspan>
<tspan x="354.90" dy="14.00">Defines the canonical Graphviz DOT conventions (graph/node/edge</tspan>
<tspan x="354.90" dy="14.00">defaults and boundary cluster styling) used when rendering</tspan>
<tspan x="354.90" dy="14.00">Aurora views to DOT/SVG.</tspan>
</text>
</g>
<g class="node card-type-test" data-card-id="TES-001" data-layout-node="TES-001">
<polygon class="node-shape" points="520.92,333.51 686.94,403.28 520.92,473.05 188.88,473.05 22.86,403.28 188.88,333.51" />
<text class="node-label" x="354.90" y="375.28" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Test</tspan>
<tspan x="354.90" dy="14.00">Validate Model Command</tspan>
<tspan x="354.90" dy="14.00">&#160;</tspan>
<tspan x="354.90" dy="14.00">Verify that the validate command detects schema/invariant violations and</tspan>
<tspan x="354.90" dy="14.00">succeeds on a valid model.</tspan>
</text>
</g>
<g class="node card-type-test" data-card-id="TES-002" data-layout-node="TES-002">
<polygon class="node-shape" points="532.35,170.55 709.80,229.95 532.35,289.35 177.45,289.35 0.00,229.95 177.45,170.55" />
<text class="node-label" x="354.90" y="201.95" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Test</tspan>
<tspan x="354.90" dy="14.00">Render All Command</tspan>
<tspan x="354.90" dy="14.00">&#160;</tspan>
<tspan x="354.90" dy="14.00">Verify that render-all produces rendered card markdown and view files</tspan>
<tspan x="354.90" dy="14.00">for a valid model.</tspan>
</text>
</g>
<g class="node card-type-test" data-card-id="TES-003" data-layout-node="TES-003">
<polygon class="node-shape" points="518.75,9.21 682.59,68.61 518.75,128.01 191.06,128.01 27.22,68.61 191.06,9.21" />
<text class="node-label" x="354.90" y="40.61" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Test</tspan>
<tspan x="354.90" dy="14.00">Compact Command</tspan>
<tspan x="354.90" dy="14.00">&#160;</tspan>
<tspan x="354.90" dy="14.00">Verify that compact export emits a compact model representation</tspan>
<tspan x="354.90" dy="14.00">conforming to the compact schema.</tspan>
</text>
</g>
