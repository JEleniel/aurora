<rect class="bg" x="0" y="0" width="100%" height="100%" />
<path class="edge-path" d="M 734.43 1132.77 C 817.18 1132.77 907.77 1132.77 990.62 1132.77" data-tail="CNS-002" data-head="CNS-004" />
<text class="edge-label" x="955.10" y="1126.11" text-anchor="middle" dominant-baseline="middle">includes</text>
<g class="node card-type-constraint" data-card-id="CNS-001" data-layout-node="CNS-001">
<rect class="node-shape" x="169.55" y="1242.78" width="566.67" height="126.66" rx="6" ry="6" />
<text class="node-icon" x="179.55" y="1271.11" text-anchor="start" dominant-baseline="hanging">📏</text>
<text class="node-label" x="237.55" y="1278.11" text-anchor="start" dominant-baseline="middle">
<tspan x="237.55">CNS-001: </tspan><tspan font-weight="700">Constraint</tspan>
<tspan x="237.55" dy="14.00">Text Based Data Format</tspan>
<tspan x="237.55" dy="14.00">&#160;</tspan>
<tspan x="237.55" dy="14.00">In order to remain human readable and editable, the data format must be</tspan>
<tspan x="237.55" dy="14.00">text based.</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-002" data-layout-node="CNS-002">
<rect class="node-shape" x="171.55" y="1047.44" width="562.67" height="170.67" rx="6" ry="6" />
<text class="node-icon" x="181.55" y="1083.77" text-anchor="start" dominant-baseline="hanging">📏</text>
<text class="node-label" x="239.55" y="1090.77" text-anchor="start" dominant-baseline="middle">
<tspan x="239.55">CNS-002: </tspan><tspan font-weight="700">Constraint</tspan><tspan> (Invariant)</tspan>
<tspan x="239.55" dy="14.00">Directed, Locally Cyclic Graph</tspan>
<tspan x="239.55" dy="14.00">&#160;</tspan>
<tspan x="239.55" dy="14.00">The model must form a Directed Graph in which all paths start from a</tspan>
<tspan x="239.55" dy="14.00">root card (&quot;Mission&quot;) and monotonically increase in length until either</tspan>
<tspan x="239.55" dy="14.00">encountering a card already encountered or reaching a leaf card (one</tspan>
<tspan x="239.55" dy="14.00">with no outgoing links).</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-003" data-layout-node="CNS-003">
<rect class="node-shape" x="177.55" y="882.11" width="550.67" height="141.33" rx="6" ry="6" />
<text class="node-icon" x="187.55" y="910.77" text-anchor="start" dominant-baseline="hanging">📏</text>
<text class="node-label" x="245.55" y="917.77" text-anchor="start" dominant-baseline="middle">
<tspan x="245.55">CNS-003: </tspan><tspan font-weight="700">Constraint</tspan>
<tspan x="245.55" dy="14.00">No Inherent Semantic Meaning</tspan>
<tspan x="245.55" dy="14.00">&#160;</tspan>
<tspan x="245.55" dy="14.00">The nodes and edges of the model must not carry any semantic meaning;</tspan>
<tspan x="245.55" dy="14.00">semantic meaning is imposed when interpreted for some use, such as</tspan>
<tspan x="245.55" dy="14.00">generating views.</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-004" data-layout-node="CNS-004">
<rect class="node-shape" x="1004.39" y="1069.44" width="537.33" height="126.66" rx="6" ry="6" />
<text class="node-icon" x="1014.39" y="1104.77" text-anchor="start" dominant-baseline="hanging">📏</text>
<text class="node-label" x="1072.39" y="1111.77" text-anchor="start" dominant-baseline="middle">
<tspan x="1072.39">CNS-004: </tspan><tspan font-weight="700">Constraint</tspan>
<tspan x="1072.39" dy="14.00">No Orphans</tspan>
<tspan x="1072.39" dy="14.00">&#160;</tspan>
<tspan x="1072.39" dy="14.00">All cards other than `Mission` must have at least one incoming link.</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-005" data-layout-node="CNS-005">
<rect class="node-shape" x="174.21" y="716.77" width="557.34" height="141.33" rx="6" ry="6" />
<text class="node-icon" x="184.21" y="745.44" text-anchor="start" dominant-baseline="hanging">📏</text>
<text class="node-label" x="242.21" y="752.44" text-anchor="start" dominant-baseline="middle">
<tspan x="242.21">CNS-005: </tspan><tspan font-weight="700">Constraint</tspan><tspan> (Graphviz)</tspan>
<tspan x="242.21" dy="14.00">Graphviz DOT View Conventions</tspan>
<tspan x="242.21" dy="14.00">&#160;</tspan>
<tspan x="242.21" dy="14.00">Defines the canonical Graphviz DOT conventions (graph/node/edge defaults</tspan>
<tspan x="242.21" dy="14.00">and boundary cluster styling) used when rendering Aurora views to</tspan>
<tspan x="242.21" dy="14.00">DOT/SVG.</tspan>
</text>
</g>
<g class="node card-type-test" data-card-id="TES-001" data-layout-node="TES-001">
<polygon class="node-shape" points="667.89,476.84 882.90,576.78 667.89,676.71 237.87,676.71 22.86,576.78 237.87,476.84" />
<text class="node-icon" x="32.86" y="541.78" text-anchor="start" dominant-baseline="hanging">🧪</text>
<text class="node-label" x="90.86" y="548.78" text-anchor="start" dominant-baseline="middle">
<tspan x="90.86">TES-001: </tspan><tspan font-weight="700">Test</tspan>
<tspan x="90.86" dy="14.00">Validate Model Command</tspan>
<tspan x="90.86" dy="14.00">&#160;</tspan>
<tspan x="90.86" dy="14.00">Verify that the validate command detects schema/invariant violations and</tspan>
<tspan x="90.86" dy="14.00">succeeds on a valid model.</tspan>
</text>
</g>
<g class="node card-type-test" data-card-id="TES-002" data-layout-node="TES-002">
<polygon class="node-shape" points="679.32,244.51 905.76,334.08 679.32,423.65 226.44,423.65 -0.00,334.08 226.44,244.51" />
<text class="node-icon" x="10.00" y="299.08" text-anchor="start" dominant-baseline="hanging">🧪</text>
<text class="node-label" x="68.00" y="306.08" text-anchor="start" dominant-baseline="middle">
<tspan x="68.00">TES-002: </tspan><tspan font-weight="700">Test</tspan>
<tspan x="68.00" dy="14.00">Render All Command</tspan>
<tspan x="68.00" dy="14.00">&#160;</tspan>
<tspan x="68.00" dy="14.00">Verify that render-all produces rendered card markdown and view files</tspan>
<tspan x="68.00" dy="14.00">for a valid model.</tspan>
</text>
</g>
<g class="node card-type-test" data-card-id="TES-003" data-layout-node="TES-003">
<polygon class="node-shape" points="665.71,13.83 878.55,103.39 665.71,192.96 240.05,192.96 27.21,103.39 240.05,13.83" />
<text class="node-icon" x="37.21" y="68.39" text-anchor="start" dominant-baseline="hanging">🧪</text>
<text class="node-label" x="95.21" y="75.39" text-anchor="start" dominant-baseline="middle">
<tspan x="95.21">TES-003: </tspan><tspan font-weight="700">Test</tspan>
<tspan x="95.21" dy="14.00">Compact Command</tspan>
<tspan x="95.21" dy="14.00">&#160;</tspan>
<tspan x="95.21" dy="14.00">Verify that compact export emits a compact model representation</tspan>
<tspan x="95.21" dy="14.00">conforming to the compact schema.</tspan>
</text>
</g>
</svg>
