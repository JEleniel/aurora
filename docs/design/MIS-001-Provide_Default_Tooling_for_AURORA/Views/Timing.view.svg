<g class="node card-type-constraint" data-card-id="CNS-001" data-layout-node="CNS-001">
<rect class="node-shape" x="14.00" y="398.06" width="446.67" height="84.00" rx="6" ry="6" />
<text class="node-label" x="237.33" y="412.06" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan>
<tspan x="237.33" dy="14.00">Text Based Data Format</tspan>
<tspan x="237.33" dy="14.00">&#160;</tspan>
<tspan x="237.33" dy="14.00">In order to remain human readable and editable, the data format</tspan>
<tspan x="237.33" dy="14.00">must be text based.</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-002" data-layout-node="CNS-002">
<rect class="node-shape" x="16.00" y="245.41" width="442.67" height="128.00" rx="6" ry="6" />
<text class="node-label" x="237.33" y="267.41" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan><tspan> (Invariant)</tspan>
<tspan x="237.33" dy="14.00">Directed, Locally Cyclic Graph</tspan>
<tspan x="237.33" dy="14.00">&#160;</tspan>
<tspan x="237.33" dy="14.00">The model must form a Directed Graph in which all paths start</tspan>
<tspan x="237.33" dy="14.00">from a root card (&quot;Mission&quot;) and monotonically increase in</tspan>
<tspan x="237.33" dy="14.00">length until either encountering a card already encountered or</tspan>
<tspan x="237.33" dy="14.00">reaching a leaf card (one with no outgoing links).</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-003" data-layout-node="CNS-003">
<rect class="node-shape" x="22.00" y="122.70" width="430.67" height="98.67" rx="6" ry="6" />
<text class="node-label" x="237.33" y="137.03" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan>
<tspan x="237.33" dy="14.00">No Inherent Semantic Meaning</tspan>
<tspan x="237.33" dy="14.00">&#160;</tspan>
<tspan x="237.33" dy="14.00">The nodes and edges of the model must not carry any semantic</tspan>
<tspan x="237.33" dy="14.00">meaning; semantic meaning is imposed when interpreted for some</tspan>
<tspan x="237.33" dy="14.00">use, such as generating views.</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-004" data-layout-node="CNS-004">
<rect class="node-shape" x="573.33" y="267.41" width="417.33" height="84.00" rx="6" ry="6" />
<text class="node-label" x="782.00" y="281.41" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan>
<tspan x="782.00" dy="14.00">No Orphans</tspan>
<tspan x="782.00" dy="14.00">&#160;</tspan>
<tspan x="782.00" dy="14.00">All cards other than `Mission` must have at least one</tspan>
<tspan x="782.00" dy="14.00">incoming link.</tspan>
</text>
</g>
<g class="node card-type-constraint" data-card-id="CNS-005" data-layout-node="CNS-005">
<rect class="node-shape" x="18.66" y="0.01" width="437.34" height="98.67" rx="6" ry="6" />
<text class="node-label" x="237.33" y="14.34" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Constraint</tspan><tspan> (Graphviz)</tspan>
<tspan x="237.33" dy="14.00">Graphviz DOT View Conventions</tspan>
<tspan x="237.33" dy="14.00">&#160;</tspan>
<tspan x="237.33" dy="14.00">Defines the canonical Graphviz DOT conventions (graph/node/edge</tspan>
<tspan x="237.33" dy="14.00">defaults and boundary cluster styling) used when rendering</tspan>
<tspan x="237.33" dy="14.00">Aurora views to DOT/SVG.</tspan>
</text>
</g>
</svg>
