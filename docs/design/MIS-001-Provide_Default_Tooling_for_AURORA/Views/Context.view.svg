<g class="node card-type-application" data-card-id="APP-001" data-layout-node="APP-001">
<rect class="node-shape" x="633.34" y="0.00" width="577.33" height="170.67" rx="6.00" ry="6.00" />
<rect class="node-shape node-shape-outline" x="637.34" y="12.00" width="14.00" height="16.00" rx="2" ry="2" />
<rect class="node-shape node-shape-outline" x="637.34" y="142.67" width="14.00" height="16.00" rx="2" ry="2" />
<text class="node-icon" x="672.34" y="36.33" text-anchor="middle" dominant-baseline="hanging">🪟</text>
<text class="node-label" x="951.00" y="43.33" text-anchor="middle" dominant-baseline="middle">
<tspan x="951.00">APP-001: </tspan><tspan font-weight="700">Application</tspan>
<tspan x="951.00" dy="14.00">Command Line Tools</tspan>
<tspan x="951.00" dy="14.00">&#160;</tspan>
<tspan x="951.00" dy="14.00">A deployable command-line application that validates, renders, and</tspan>
<tspan x="951.00" dy="14.00">manages Aurora models. The CLI is optimized for deterministic,</tspan>
<tspan x="951.00" dy="14.00">automatable workflows (local scripting and CI), and delegates model</tspan>
<tspan x="951.00" dy="14.00">semantics (parsing, invariants, rendering) to the shared library.</tspan>
</text>
</g>
<g class="node card-type-application" data-card-id="APP-002" data-layout-node="APP-002">
<rect class="node-shape" x="647.34" y="194.66" width="549.33" height="170.67" rx="6.00" ry="6.00" />
<rect class="node-shape node-shape-outline" x="651.34" y="206.66" width="14.00" height="16.00" rx="2" ry="2" />
<rect class="node-shape node-shape-outline" x="651.34" y="337.33" width="14.00" height="16.00" rx="2" ry="2" />
<text class="node-icon" x="686.34" y="230.99" text-anchor="middle" dominant-baseline="hanging">🪟</text>
<text class="node-label" x="951.00" y="237.99" text-anchor="middle" dominant-baseline="middle">
<tspan x="951.00">APP-002: </tspan><tspan font-weight="700">Application</tspan>
<tspan x="951.00" dy="14.00">Editor</tspan>
<tspan x="951.00" dy="14.00">&#160;</tspan>
<tspan x="951.00" dy="14.00">A deployable application that provides an interactive experience for</tspan>
<tspan x="951.00" dy="14.00">creating, editing, and navigating Aurora models. The Editor focuses on</tspan>
<tspan x="951.00" dy="14.00">discoverability and safe, incremental iteration with immediate</tspan>
<tspan x="951.00" dy="14.00">validation feedback.</tspan>
</text>
</g>
<g class="node card-type-application" data-card-id="APP-003" data-layout-node="APP-003">
<rect class="node-shape" x="644.67" y="389.33" width="554.67" height="170.67" rx="6.00" ry="6.00" />
<rect class="node-shape node-shape-outline" x="648.67" y="401.33" width="14.00" height="16.00" rx="2" ry="2" />
<rect class="node-shape node-shape-outline" x="648.67" y="532.00" width="14.00" height="16.00" rx="2" ry="2" />
<text class="node-icon" x="683.67" y="425.66" text-anchor="middle" dominant-baseline="hanging">🪟</text>
<text class="node-label" x="951.00" y="432.66" text-anchor="middle" dominant-baseline="middle">
<tspan x="951.00">APP-003: </tspan><tspan font-weight="700">Application</tspan>
<tspan x="951.00" dy="14.00">VSCode Extension</tspan>
<tspan x="951.00" dy="14.00">&#160;</tspan>
<tspan x="951.00" dy="14.00">A VS Code extension that enables authoring, validation, and</tspan>
<tspan x="951.00" dy="14.00">visualization of Aurora models within the editor. It provides</tspan>
<tspan x="951.00" dy="14.00">trust-aware workspace integration, webview-based UI experiences, and</tspan>
<tspan x="951.00" dy="14.00">(optionally) an MCP server surface for other in-editor tooling.</tspan>
</text>
</g>
<g class="node card-type-note" data-card-id="NOT-001" data-layout-node="NOT-001">
<path class="node-shape" d="M 1286.69 404.00 L 1822.69 404.00 L 1838.69 420.00 L 1838.69 545.33 L 1286.69 545.33 Z" />
<path class="node-shape node-shape-outline" d="M 1822.69 404.00 L 1822.69 420.00 L 1838.69 420.00" />
<text class="node-icon" x="1325.69" y="432.66" text-anchor="middle" dominant-baseline="hanging">🗒️</text>
<text class="node-label" x="1591.69" y="439.66" text-anchor="middle" dominant-baseline="middle">
<tspan x="1591.69">NOT-001: </tspan><tspan font-weight="700">Note</tspan>
<tspan x="1591.69" dy="14.00">Shareable</tspan>
<tspan x="1591.69" dy="14.00">&#160;</tspan>
<tspan x="1591.69" dy="14.00">Tooling surfaces should prioritize shareable, portable artifacts (e.g.,</tspan>
<tspan x="1591.69" dy="14.00">rendered views and model packages) without compromising workspace trust</tspan>
<tspan x="1591.69" dy="14.00">and path safety.</tspan>
</text>
</g>
<g class="node card-type-system" data-card-id="SYS-001" data-layout-node="SYS-001">
<path class="node-shape" d="M 0.00 232.66 L 0.00 343.32 L 524.00 343.32 L 524.00 232.66 L 191.40 232.66 L 191.40 216.66 L 8.00 216.66 L 8.00 232.66 Z" />
<text class="node-icon" x="39.00" y="244.99" text-anchor="middle" dominant-baseline="hanging">🧱</text>
<text class="node-label" x="291.00" y="251.99" text-anchor="middle" dominant-baseline="middle">
<tspan x="291.00">SYS-001: </tspan><tspan font-weight="700">System</tspan>
<tspan x="291.00" dy="14.00">Default Tooling Platform</tspan>
<tspan x="291.00" dy="14.00">&#160;</tspan>
<tspan x="291.00" dy="14.00">A bounded system that delivers the default Aurora tooling surfaces:</tspan>
<tspan x="291.00" dy="14.00">CLI, Editor, and VSCode Extension.</tspan>
</text>
