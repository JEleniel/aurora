<g class="node card-type-asset" data-card-id="AST-001" data-layout-node="AST-001">
<rect class="node-shape" x="980.40" y="228.17" width="564.00" height="141.33" rx="6" ry="6" />
<text class="node-icon" x="1019.40" y="263.84" text-anchor="middle" dominant-baseline="hanging">🛡️</text>
<text class="node-label" x="1291.40" y="270.84" text-anchor="middle" dominant-baseline="middle">
<tspan x="1291.40">AST-001: </tspan><tspan font-weight="700">Asset</tspan>
<tspan x="1291.40" dy="14.00">Aurora Models</tspan>
<tspan x="1291.40" dy="14.00">&#160;</tspan>
<tspan x="1291.40" dy="14.00">Aurora model source files (cards and schema references) that represent</tspan>
<tspan x="1291.40" dy="14.00">the authoritative architecture model content.</tspan>
</text>
</g>
<g class="node card-type-asset" data-card-id="AST-002" data-layout-node="AST-002">
<rect class="node-shape" x="988.40" y="757.51" width="548.00" height="141.33" rx="6" ry="6" />
<text class="node-icon" x="1027.40" y="793.17" text-anchor="middle" dominant-baseline="hanging">🛡️</text>
<text class="node-label" x="1291.40" y="800.17" text-anchor="middle" dominant-baseline="middle">
<tspan x="1291.40">AST-002: </tspan><tspan font-weight="700">Asset</tspan>
<tspan x="1291.40" dy="14.00">Rendered Documentation Output</tspan>
<tspan x="1291.40" dy="14.00">&#160;</tspan>
<tspan x="1291.40" dy="14.00">Generated Markdown and view artifacts produced from Aurora models</tspan>
<tspan x="1291.40" dy="14.00">(e.g., rendered card pages and view markdown).</tspan>
</text>
</g>
<g class="node card-type-asset" data-card-id="AST-003" data-layout-node="AST-003">
<rect class="node-shape" x="989.07" y="445.51" width="546.66" height="141.33" rx="6" ry="6" />
<text class="node-icon" x="1028.07" y="481.17" text-anchor="middle" dominant-baseline="hanging">🛡️</text>
<text class="node-label" x="1291.40" y="488.17" text-anchor="middle" dominant-baseline="middle">
<tspan x="1291.40">AST-003: </tspan><tspan font-weight="700">Asset</tspan>
<tspan x="1291.40" dy="14.00">User Workspace Content</tspan>
<tspan x="1291.40" dy="14.00">&#160;</tspan>
<tspan x="1291.40" dy="14.00">The user’s workspace files and settings (including source code and</tspan>
<tspan x="1291.40" dy="14.00">secrets) that tooling must not corrupt or exfiltrate.</tspan>
</text>
</g>
<g class="node card-type-control" data-card-id="CTL-001" data-layout-node="CTL-001">
<polygon class="node-shape" points="600.97,488.23 827.40,546.78 827.40,629.57 600.97,688.11 280.74,688.11 54.30,629.57 54.30,546.78 280.74,488.23" />
<text class="node-icon" x="61.45" y="546.17" text-anchor="middle" dominant-baseline="hanging">🔒</text>
<text class="node-label" x="469.85" y="553.17" text-anchor="middle" dominant-baseline="middle">
<tspan x="469.85">CTL-001: </tspan><tspan font-weight="700">Control</tspan>
<tspan x="469.85" dy="14.00">Workspace Trust Gate</tspan>
<tspan x="469.85" dy="14.00">&#160;</tspan>
<tspan x="469.85" dy="14.00">Gate potentially unsafe operations (e.g., file writes, webview</tspan>
<tspan x="469.85" dy="14.00">rendering, executing tools) behind workspace trust checks and explicit</tspan>
<tspan x="469.85" dy="14.00">user consent.</tspan>
</text>
</g>
<g class="node card-type-control" data-card-id="CTL-002" data-layout-node="CTL-002">
<polygon class="node-shape" points="604.09,248.23 834.95,306.78 834.95,389.57 604.09,448.11 277.61,448.11 46.76,389.57 46.76,306.78 277.61,248.23" />
<text class="node-icon" x="53.28" y="306.17" text-anchor="middle" dominant-baseline="hanging">🔒</text>
<text class="node-label" x="469.85" y="313.17" text-anchor="middle" dominant-baseline="middle">
<tspan x="469.85">CTL-002: </tspan><tspan font-weight="700">Control</tspan>
<tspan x="469.85" dy="14.00">Safe Path Handling and Atomic Writes</tspan>
<tspan x="469.85" dy="14.00">&#160;</tspan>
<tspan x="469.85" dy="14.00">Constrain paths to the intended workspace/model roots, normalize and</tspan>
<tspan x="469.85" dy="14.00">validate paths, and use atomic write patterns to prevent partial writes</tspan>
<tspan x="469.85" dy="14.00">and clobbering.</tspan>
</text>
</g>
<g class="node card-type-control" data-card-id="CTL-003" data-layout-node="CTL-003">
<polygon class="node-shape" points="609.56,728.23 848.14,786.78 848.14,869.57 609.56,928.11 272.14,928.11 33.56,869.57 33.56,786.78 272.14,728.23" />
<text class="node-icon" x="39.00" y="793.17" text-anchor="middle" dominant-baseline="hanging">🔒</text>
<text class="node-label" x="469.85" y="800.17" text-anchor="middle" dominant-baseline="middle">
<tspan x="469.85">CTL-003: </tspan><tspan font-weight="700">Control</tspan>
<tspan x="469.85" dy="14.00">Content Sanitization</tspan>
<tspan x="469.85" dy="14.00">&#160;</tspan>
<tspan x="469.85" dy="14.00">Sanitize rendered Markdown and webview content, restrict resource</tspan>
<tspan x="469.85" dy="14.00">loading, and disable script execution to prevent injection.</tspan>
</text>
</g>
<g class="node card-type-control" data-card-id="CTL-004" data-layout-node="CTL-004">
<polygon class="node-shape" points="605.65,8.23 838.72,66.78 838.72,149.57 605.65,208.11 276.05,208.11 42.99,149.57 42.99,66.78 276.05,8.23" />
<text class="node-icon" x="49.20" y="73.17" text-anchor="middle" dominant-baseline="hanging">🔒</text>
<text class="node-label" x="469.85" y="80.17" text-anchor="middle" dominant-baseline="middle">
<tspan x="469.85">CTL-004: </tspan><tspan font-weight="700">Control</tspan>
<tspan x="469.85" dy="14.00">Least Privilege File Access</tspan>
<tspan x="469.85" dy="14.00">&#160;</tspan>
<tspan x="469.85" dy="14.00">Minimize read/write permissions and scope operations to explicit</tspan>
<tspan x="469.85" dy="14.00">user-selected paths; avoid reading or writing unrelated workspace files.</tspan>
</text>
</g>
</svg>
