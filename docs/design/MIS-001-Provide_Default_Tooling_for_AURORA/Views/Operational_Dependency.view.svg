<g class="node card-type-actor" data-card-id="ACT-001" data-layout-node="ACT-001">
<ellipse class="node-shape" cx="291.33" cy="535.51" rx="291.33" ry="59.40" />
<text class="node-label" x="291.33" y="507.51" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Actor</tspan>
<tspan x="291.33" dy="14.00">Architect</tspan>
<tspan x="291.33" dy="14.00">&#160;</tspan>
<tspan x="291.33" dy="14.00">Person responsible for authoring and maintaining the Aurora model for a</tspan>
<tspan x="291.33" dy="14.00">system.</tspan>
</text>
</g>
<g class="node card-type-actor" data-card-id="ACT-002" data-layout-node="ACT-002">
<ellipse class="node-shape" cx="291.33" cy="392.85" rx="291.33" ry="59.40" />
<text class="node-label" x="291.33" y="364.85" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Actor</tspan>
<tspan x="291.33" dy="14.00">User</tspan>
<tspan x="291.33" dy="14.00">&#160;</tspan>
<tspan x="291.33" dy="14.00">Person using Aurora tooling surfaces to browse, edit, validate, and</tspan>
<tspan x="291.33" dy="14.00">render models in a workspace.</tspan>
</text>
</g>
<g class="node card-type-actor" data-card-id="ACT-003" data-layout-node="ACT-003">
<ellipse class="node-shape" cx="291.33" cy="250.19" rx="279.07" ry="59.40" />
<text class="node-label" x="291.33" y="222.19" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Actor</tspan>
<tspan x="291.33" dy="14.00">Malicious Workspace Author</tspan>
<tspan x="291.33" dy="14.00">&#160;</tspan>
<tspan x="291.33" dy="14.00">Adversarial actor who crafts workspace content to exploit tooling</tspan>
<tspan x="291.33" dy="14.00">behavior.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-001" data-layout-node="RIS-001">
<polygon class="node-shape" points="1913.50,16.12 2078.64,50.91 2078.64,100.12 1913.50,134.91 1679.97,134.91 1514.84,100.12 1514.84,50.91 1679.97,16.12" />
<text class="node-label" x="1796.74" y="47.51" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Risk</tspan>
<tspan x="1796.74" dy="14.00">Injected Content in Rendered Output</tspan>
<tspan x="1796.74" dy="14.00">&#160;</tspan>
<tspan x="1796.74" dy="14.00">Rendered output could contain unsafe content that misleads users or</tspan>
<tspan x="1796.74" dy="14.00">executes in a webview context.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-002" data-layout-node="RIS-002">
<polygon class="node-shape" points="1911.55,190.79 2073.92,225.58 2073.92,274.79 1911.55,309.58 1681.92,309.58 1519.55,274.79 1519.55,225.58 1681.92,190.79" />
<text class="node-label" x="1796.74" y="222.19" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Risk</tspan>
<tspan x="1796.74" dy="14.00">Unintended File Modification</tspan>
<tspan x="1796.74" dy="14.00">&#160;</tspan>
<tspan x="1796.74" dy="14.00">Tooling could overwrite or corrupt files outside the intended model</tspan>
<tspan x="1796.74" dy="14.00">output locations.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-003" data-layout-node="RIS-003">
<polygon class="node-shape" points="1929.90,355.08 2118.23,395.95 2118.23,453.75 1929.90,494.62 1663.57,494.62 1475.24,453.75 1475.24,395.95 1663.57,355.08" />
<text class="node-label" x="1796.74" y="396.85" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Risk</tspan>
<tspan x="1796.74" dy="14.00">Data Exposure from Untrusted Workspace</tspan>
<tspan x="1796.74" dy="14.00">&#160;</tspan>
<tspan x="1796.74" dy="14.00">Operating against untrusted workspace content could lead to disclosure</tspan>
<tspan x="1796.74" dy="14.00">of sensitive data or unintended access beyond user intent.</tspan>
</text>
</g>
<g class="node card-type-system" data-card-id="SYS-001" data-layout-node="SYS-001">
<rect class="node-shape" x="89.33" y="82.85" width="404.00" height="84.00" rx="6" ry="6" />
<text class="node-label" x="291.33" y="96.85" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">System</tspan>
<tspan x="291.33" dy="14.00">Default Tooling Platform</tspan>
<tspan x="291.33" dy="14.00">&#160;</tspan>
<tspan x="291.33" dy="14.00">A bounded system that delivers the default Aurora tooling</tspan>
<tspan x="291.33" dy="14.00">surfaces: CLI, Editor, and VSCode Extension.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-001" data-layout-node="THR-001">
<polygon class="node-shape" points="1143.83,5.74 1322.22,46.61 1322.22,104.41 1143.83,145.28 891.56,145.28 713.17,104.41 713.17,46.61 891.56,5.74" />
<text class="node-label" x="1017.70" y="47.51" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Threat</tspan>
<tspan x="1017.70" dy="14.00">Script Injection via Markdown</tspan>
<tspan x="1017.70" dy="14.00">&#160;</tspan>
<tspan x="1017.70" dy="14.00">Untrusted content in model descriptions or rendered Markdown could</tspan>
<tspan x="1017.70" dy="14.00">inject script or unsafe resources into a webview-based renderer.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-002" data-layout-node="THR-002">
<polygon class="node-shape" points="1143.45,180.42 1321.28,221.29 1321.28,279.09 1143.45,319.96 891.95,319.96 714.11,279.09 714.11,221.29 891.95,180.42" />
<text class="node-label" x="1017.70" y="215.19" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Threat</tspan>
<tspan x="1017.70" dy="14.00">Path Traversal or Arbitrary Write</tspan>
<tspan x="1017.70" dy="14.00">&#160;</tspan>
<tspan x="1017.70" dy="14.00">A crafted input path or unsafe write behavior could cause tooling to</tspan>
<tspan x="1017.70" dy="14.00">write outside the intended model/workspace directory, overwriting</tspan>
<tspan x="1017.70" dy="14.00">unrelated files.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-003" data-layout-node="THR-003">
<polygon class="node-shape" points="1145.40,355.08 1326.00,395.95 1326.00,453.75 1145.40,494.62 889.99,494.62 709.40,453.75 709.40,395.95 889.99,355.08" />
<text class="node-label" x="1017.70" y="396.85" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">Threat</tspan>
<tspan x="1017.70" dy="14.00">Untrusted Workspace Execution or Access</tspan>
<tspan x="1017.70" dy="14.00">&#160;</tspan>
<tspan x="1017.70" dy="14.00">Operating in an untrusted workspace could allow unsafe operations that</tspan>
<tspan x="1017.70" dy="14.00">lead to data exposure or unintended execution paths.</tspan>
</text>
</g>
</svg>
