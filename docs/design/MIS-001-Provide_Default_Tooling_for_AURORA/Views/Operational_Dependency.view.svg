<tspan font-weight="700">👤 Actor</tspan>
<tspan x="300.40" dy="14.00">Architect</tspan>
<tspan x="300.40" dy="14.00">&#160;</tspan>
<tspan x="300.40" dy="14.00">Person responsible for authoring and maintaining the Aurora model for a</tspan>
<tspan x="300.40" dy="14.00">system.</tspan>
</text>
</g>
<g class="node card-type-actor" data-card-id="ACT-002" data-layout-node="ACT-002">
<ellipse class="node-shape" cx="300.40" cy="392.85" rx="291.33" ry="59.40" />
<text class="node-label" x="300.40" y="364.85" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">👤 Actor</tspan>
<tspan x="300.40" dy="14.00">User</tspan>
<tspan x="300.40" dy="14.00">&#160;</tspan>
<tspan x="300.40" dy="14.00">Person using Aurora tooling surfaces to browse, edit, validate, and</tspan>
<tspan x="300.40" dy="14.00">render models in a workspace.</tspan>
</text>
</g>
<g class="node card-type-actor" data-card-id="ACT-003" data-layout-node="ACT-003">
<ellipse class="node-shape" cx="300.40" cy="250.19" rx="279.07" ry="59.40" />
<text class="node-label" x="300.40" y="222.19" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">👤 Actor</tspan>
<tspan x="300.40" dy="14.00">Malicious Workspace Author</tspan>
<tspan x="300.40" dy="14.00">&#160;</tspan>
<tspan x="300.40" dy="14.00">Adversarial actor who crafts workspace content to exploit tooling</tspan>
<tspan x="300.40" dy="14.00">behavior.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-001" data-layout-node="RIS-001">
<polygon class="node-shape" points="1922.53,16.12 2087.66,50.91 2087.66,100.12 1922.53,134.91 1688.99,134.91 1523.86,100.12 1523.86,50.91 1688.99,16.12" />
<text class="node-label" x="1805.76" y="47.51" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">⚠️ Risk</tspan>
<tspan x="1805.76" dy="14.00">Injected Content in Rendered Output</tspan>
<tspan x="1805.76" dy="14.00">&#160;</tspan>
<tspan x="1805.76" dy="14.00">Rendered output could contain unsafe content that misleads users or</tspan>
<tspan x="1805.76" dy="14.00">executes in a webview context.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-002" data-layout-node="RIS-002">
<polygon class="node-shape" points="1920.57,190.79 2082.95,225.58 2082.95,274.79 1920.57,309.58 1690.95,309.58 1528.57,274.79 1528.57,225.58 1690.95,190.79" />
<text class="node-label" x="1805.76" y="222.19" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">⚠️ Risk</tspan>
<tspan x="1805.76" dy="14.00">Unintended File Modification</tspan>
<tspan x="1805.76" dy="14.00">&#160;</tspan>
<tspan x="1805.76" dy="14.00">Tooling could overwrite or corrupt files outside the intended model</tspan>
<tspan x="1805.76" dy="14.00">output locations.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-003" data-layout-node="RIS-003">
<polygon class="node-shape" points="1938.93,355.08 2127.26,395.95 2127.26,453.75 1938.93,494.62 1672.59,494.62 1484.26,453.75 1484.26,395.95 1672.59,355.08" />
<text class="node-label" x="1805.76" y="396.85" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">⚠️ Risk</tspan>
<tspan x="1805.76" dy="14.00">Data Exposure from Untrusted Workspace</tspan>
<tspan x="1805.76" dy="14.00">&#160;</tspan>
<tspan x="1805.76" dy="14.00">Operating against untrusted workspace content could lead to disclosure</tspan>
<tspan x="1805.76" dy="14.00">of sensitive data or unintended access beyond user intent.</tspan>
</text>
</g>
<g class="node card-type-system" data-card-id="SYS-001" data-layout-node="SYS-001">
<path class="node-shape" d="M 98.40 69.51 L 98.40 137.51 L 502.40 137.51 L 502.40 69.51 L 247.80 69.51 L 247.80 53.51 L 106.40 53.51 L 106.40 69.51 Z" />
<text class="node-label" x="300.40" y="67.51" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">🧱 System</tspan>
<tspan x="300.40" dy="14.00">Default Tooling Platform</tspan>
<tspan x="300.40" dy="14.00">&#160;</tspan>
<tspan x="300.40" dy="14.00">A bounded system that delivers the default Aurora tooling</tspan>
<tspan x="300.40" dy="14.00">surfaces: CLI, Editor, and VSCode Extension.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-001" data-layout-node="THR-001">
<polygon class="node-shape" points="1152.86,5.74 1331.25,46.61 1331.25,104.41 1152.86,145.28 900.58,145.28 722.19,104.41 722.19,46.61 900.58,5.74" />
<text class="node-label" x="1026.72" y="47.51" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">🐛 Threat</tspan>
<tspan x="1026.72" dy="14.00">Script Injection via Markdown</tspan>
<tspan x="1026.72" dy="14.00">&#160;</tspan>
<tspan x="1026.72" dy="14.00">Untrusted content in model descriptions or rendered Markdown could</tspan>
<tspan x="1026.72" dy="14.00">inject script or unsafe resources into a webview-based renderer.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-002" data-layout-node="THR-002">
<polygon class="node-shape" points="1152.47,180.42 1330.31,221.29 1330.31,279.09 1152.47,319.96 900.97,319.96 723.13,279.09 723.13,221.29 900.97,180.42" />
<text class="node-label" x="1026.72" y="215.19" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">🐛 Threat</tspan>
<tspan x="1026.72" dy="14.00">Path Traversal or Arbitrary Write</tspan>
<tspan x="1026.72" dy="14.00">&#160;</tspan>
<tspan x="1026.72" dy="14.00">A crafted input path or unsafe write behavior could cause tooling to</tspan>
<tspan x="1026.72" dy="14.00">write outside the intended model/workspace directory, overwriting</tspan>
<tspan x="1026.72" dy="14.00">unrelated files.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-003" data-layout-node="THR-003">
<polygon class="node-shape" points="1154.42,355.08 1335.02,395.95 1335.02,453.75 1154.42,494.62 899.02,494.62 718.42,453.75 718.42,395.95 899.02,355.08" />
<text class="node-label" x="1026.72" y="396.85" text-anchor="middle" dominant-baseline="middle">
<tspan font-weight="700">🐛 Threat</tspan>
<tspan x="1026.72" dy="14.00">Untrusted Workspace Execution or Access</tspan>
<tspan x="1026.72" dy="14.00">&#160;</tspan>
<tspan x="1026.72" dy="14.00">Operating in an untrusted workspace could allow unsafe operations that</tspan>
<tspan x="1026.72" dy="14.00">lead to data exposure or unintended execution paths.</tspan>
</text>
</g>
</svg>
