<text class="node-icon" x="60.33" y="492.34" text-anchor="middle" dominant-baseline="hanging">👤</text>
<text class="node-label" x="414.26" y="499.34" text-anchor="middle" dominant-baseline="middle">
<tspan x="414.26">ACT-003: </tspan><tspan font-weight="700">Actor</tspan>
<tspan x="414.26" dy="14.00">Malicious Workspace Author</tspan>
<tspan x="414.26" dy="14.00">&#160;</tspan>
<tspan x="414.26" dy="14.00">Adversarial actor who crafts workspace content to exploit tooling</tspan>
<tspan x="414.26" dy="14.00">behavior.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-001" data-layout-node="RIS-001">
<polygon class="node-shape" points="2406.95,677.77 2621.79,730.24 2621.79,804.44 2406.95,856.90 2103.13,856.90 1888.29,804.44 1888.29,730.24 2103.13,677.77" />
<text class="node-icon" x="1897.07" y="732.34" text-anchor="middle" dominant-baseline="hanging">⚠️</text>
<text class="node-label" x="2284.04" y="739.34" text-anchor="middle" dominant-baseline="middle">
<tspan x="2284.04">RIS-001: </tspan><tspan font-weight="700">Risk</tspan>
<tspan x="2284.04" dy="14.00">Injected Content in Rendered Output</tspan>
<tspan x="2284.04" dy="14.00">&#160;</tspan>
<tspan x="2284.04" dy="14.00">Rendered output could contain unsafe content that misleads users or</tspan>
<tspan x="2284.04" dy="14.00">executes in a webview context.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-002" data-layout-node="RIS-002">
<polygon class="node-shape" points="2405.00,437.77 2617.08,490.24 2617.08,564.44 2405.00,616.90 2105.08,616.90 1893.00,564.44 1893.00,490.24 2105.08,437.77" />
<text class="node-icon" x="1902.17" y="492.34" text-anchor="middle" dominant-baseline="hanging">⚠️</text>
<text class="node-label" x="2284.04" y="499.34" text-anchor="middle" dominant-baseline="middle">
<tspan x="2284.04">RIS-002: </tspan><tspan font-weight="700">Risk</tspan>
<tspan x="2284.04" dy="14.00">Unintended File Modification</tspan>
<tspan x="2284.04" dy="14.00">&#160;</tspan>
<tspan x="2284.04" dy="14.00">Tooling could overwrite or corrupt files outside the intended model</tspan>
<tspan x="2284.04" dy="14.00">output locations.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-003" data-layout-node="RIS-003">
<polygon class="node-shape" points="2423.36,187.39 2661.39,245.93 2661.39,328.72 2423.36,387.27 2086.72,387.27 1848.69,328.72 1848.69,245.93 2086.72,187.39" />
<text class="node-icon" x="1854.21" y="252.33" text-anchor="middle" dominant-baseline="hanging">⚠️</text>
<text class="node-label" x="2284.04" y="259.33" text-anchor="middle" dominant-baseline="middle">
<tspan x="2284.04">RIS-003: </tspan><tspan font-weight="700">Risk</tspan>
<tspan x="2284.04" dy="14.00">Data Exposure from Untrusted Workspace</tspan>
<tspan x="2284.04" dy="14.00">&#160;</tspan>
<tspan x="2284.04" dy="14.00">Operating against untrusted workspace content could lead to disclosure</tspan>
<tspan x="2284.04" dy="14.00">of sensitive data or unintended access beyond user intent.</tspan>
</text>
</g>
<g class="node card-type-system" data-card-id="SYS-001" data-layout-node="SYS-001">
<path class="node-shape" d="M 123.26 16.03 L 123.26 126.69 L 647.26 126.69 L 647.26 16.03 L 314.66 16.03 L 314.66 0.03 L 131.26 0.03 L 131.26 16.03 Z" />
<text class="node-icon" x="162.26" y="28.36" text-anchor="middle" dominant-baseline="hanging">🧱</text>
<text class="node-label" x="414.26" y="35.36" text-anchor="middle" dominant-baseline="middle">
<tspan x="414.26">SYS-001: </tspan><tspan font-weight="700">System</tspan>
<tspan x="414.26" dy="14.00">Default Tooling Platform</tspan>
<tspan x="414.26" dy="14.00">&#160;</tspan>
<tspan x="414.26" dy="14.00">A bounded system that delivers the default Aurora tooling surfaces:</tspan>
<tspan x="414.26" dy="14.00">CLI, Editor, and VSCode Extension.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-001" data-layout-node="THR-001">
<polygon class="node-shape" points="1449.61,667.40 1677.70,725.94 1677.70,808.73 1449.61,867.28 1127.03,867.28 898.94,808.73 898.94,725.94 1127.03,667.40" />
<text class="node-icon" x="905.86" y="732.34" text-anchor="middle" dominant-baseline="hanging">🐛</text>
<text class="node-label" x="1317.32" y="739.34" text-anchor="middle" dominant-baseline="middle">
<tspan x="1317.32">THR-001: </tspan><tspan font-weight="700">Threat</tspan>
<tspan x="1317.32" dy="14.00">Script Injection via Markdown</tspan>
<tspan x="1317.32" dy="14.00">&#160;</tspan>
<tspan x="1317.32" dy="14.00">Untrusted content in model descriptions or rendered Markdown could</tspan>
<tspan x="1317.32" dy="14.00">inject script or unsafe resources into a webview-based renderer.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-002" data-layout-node="THR-002">
<polygon class="node-shape" points="1449.22,427.40 1676.76,485.94 1676.76,568.73 1449.22,627.28 1127.42,627.28 899.88,568.73 899.88,485.94 1127.42,427.40" />
<text class="node-icon" x="906.88" y="485.34" text-anchor="middle" dominant-baseline="hanging">🐛</text>
<text class="node-label" x="1317.32" y="492.34" text-anchor="middle" dominant-baseline="middle">
<tspan x="1317.32">THR-002: </tspan><tspan font-weight="700">Threat</tspan>
<tspan x="1317.32" dy="14.00">Path Traversal or Arbitrary Write</tspan>
<tspan x="1317.32" dy="14.00">&#160;</tspan>
<tspan x="1317.32" dy="14.00">A crafted input path or unsafe write behavior could cause tooling to</tspan>
<tspan x="1317.32" dy="14.00">write outside the intended model/workspace directory, overwriting</tspan>
<tspan x="1317.32" dy="14.00">unrelated files.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-003" data-layout-node="THR-003">
<polygon class="node-shape" points="1451.17,187.39 1681.47,245.93 1681.47,328.72 1451.17,387.27 1125.47,387.27 895.17,328.72 895.17,245.93 1125.47,187.39" />
<text class="node-icon" x="901.78" y="252.33" text-anchor="middle" dominant-baseline="hanging">🐛</text>
<text class="node-label" x="1317.32" y="259.33" text-anchor="middle" dominant-baseline="middle">
<tspan x="1317.32">THR-003: </tspan><tspan font-weight="700">Threat</tspan>
<tspan x="1317.32" dy="14.00">Untrusted Workspace Execution or Access</tspan>
<tspan x="1317.32" dy="14.00">&#160;</tspan>
<tspan x="1317.32" dy="14.00">Operating in an untrusted workspace could allow unsafe operations that</tspan>
<tspan x="1317.32" dy="14.00">lead to data exposure or unintended execution paths.</tspan>
</text>
</g>
