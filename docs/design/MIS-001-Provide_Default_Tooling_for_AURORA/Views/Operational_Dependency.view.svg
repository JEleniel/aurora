<text class="node-label" x="77.08" y="1160.67" text-anchor="start" dominant-baseline="middle">
<tspan x="77.08">ACT-001: </tspan><tspan font-weight="700">Actor</tspan>
<tspan x="77.08" dy="14.00">Architect</tspan>
<tspan x="77.08" dy="14.00">&#160;</tspan>
<tspan x="77.08" dy="14.00">Person responsible for authoring and maintaining the Aurora model for a</tspan>
<tspan x="77.08" dy="14.00">system.</tspan>
</text>
</g>
<g class="node card-type-actor" data-card-id="ACT-002" data-layout-node="ACT-002">
