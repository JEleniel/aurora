<tspan x="89.33">ACT-003: </tspan><tspan font-weight="700">Actor</tspan>
<tspan x="89.33" dy="14.00">Malicious Workspace Author</tspan>
<tspan x="89.33" dy="14.00">&#160;</tspan>
<tspan x="89.33" dy="14.00">Adversarial actor who crafts workspace content to exploit tooling</tspan>
<tspan x="89.33" dy="14.00">behavior.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-001" data-layout-node="RIS-001">
<polygon class="node-shape" points="2402.92,677.77 2617.76,730.24 2617.76,804.44 2402.92,856.90 2099.09,856.90 1884.26,804.44 1884.26,730.24 2099.09,677.77" />
<text class="node-icon" x="1864.04" y="732.34" text-anchor="start" dominant-baseline="hanging">⚠️</text>
<text class="node-label" x="1922.04" y="739.34" text-anchor="start" dominant-baseline="middle">
<tspan x="1922.04">RIS-001: </tspan><tspan font-weight="700">Risk</tspan>
<tspan x="1922.04" dy="14.00">Injected Content in Rendered Output</tspan>
<tspan x="1922.04" dy="14.00">&#160;</tspan>
<tspan x="1922.04" dy="14.00">Rendered output could contain unsafe content that misleads users or</tspan>
<tspan x="1922.04" dy="14.00">executes in a webview context.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-002" data-layout-node="RIS-002">
<polygon class="node-shape" points="2400.97,437.77 2613.05,490.24 2613.05,564.44 2400.97,616.90 2101.05,616.90 1888.97,564.44 1888.97,490.24 2101.05,437.77" />
<text class="node-icon" x="1869.14" y="492.34" text-anchor="start" dominant-baseline="hanging">⚠️</text>
<text class="node-label" x="1927.14" y="499.34" text-anchor="start" dominant-baseline="middle">
<tspan x="1927.14">RIS-002: </tspan><tspan font-weight="700">Risk</tspan>
<tspan x="1927.14" dy="14.00">Unintended File Modification</tspan>
<tspan x="1927.14" dy="14.00">&#160;</tspan>
<tspan x="1927.14" dy="14.00">Tooling could overwrite or corrupt files outside the intended model</tspan>
<tspan x="1927.14" dy="14.00">output locations.</tspan>
</text>
</g>
<g class="node card-type-risk" data-card-id="RIS-003" data-layout-node="RIS-003">
<polygon class="node-shape" points="2419.32,187.39 2657.36,245.93 2657.36,328.72 2419.32,387.27 2082.69,387.27 1844.66,328.72 1844.66,245.93 2082.69,187.39" />
<text class="node-icon" x="1821.18" y="252.33" text-anchor="start" dominant-baseline="hanging">⚠️</text>
<text class="node-label" x="1879.18" y="259.33" text-anchor="start" dominant-baseline="middle">
<tspan x="1879.18">RIS-003: </tspan><tspan font-weight="700">Risk</tspan>
<tspan x="1879.18" dy="14.00">Data Exposure from Untrusted Workspace</tspan>
<tspan x="1879.18" dy="14.00">&#160;</tspan>
<tspan x="1879.18" dy="14.00">Operating against untrusted workspace content could lead to disclosure</tspan>
<tspan x="1879.18" dy="14.00">of sensitive data or unintended access beyond user intent.</tspan>
</text>
</g>
<g class="node card-type-system" data-card-id="SYS-001" data-layout-node="SYS-001">
