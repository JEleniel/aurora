<text class="node-icon" x="48.08" y="1153.67" text-anchor="middle" dominant-baseline="hanging">👤</text>
<text class="node-label" x="414.26" y="1160.67" text-anchor="middle" dominant-baseline="middle">
<tspan x="414.26">ACT-001: </tspan><tspan font-weight="700">Actor</tspan>
<tspan x="414.26" dy="14.00">Architect</tspan>
<tspan x="414.26" dy="14.00">&#160;</tspan>
<tspan x="414.26" dy="14.00">Person responsible for authoring and maintaining the Aurora model for a</tspan>
<tspan x="414.26" dy="14.00">system.</tspan>
</text>
</g>
<g class="node card-type-actor" data-card-id="ACT-002" data-layout-node="ACT-002">
<ellipse class="node-shape" cx="385.26" cy="986.01" rx="376.18" ry="89.57" />
<text class="node-icon" x="48.08" y="951.01" text-anchor="middle" dominant-baseline="hanging">👤</text>
<text class="node-label" x="414.26" y="958.01" text-anchor="middle" dominant-baseline="middle">
<tspan x="414.26">ACT-002: </tspan><tspan font-weight="700">Actor</tspan>
<tspan x="414.26" dy="14.00">User</tspan>
<tspan x="414.26" dy="14.00">&#160;</tspan>
<tspan x="414.26" dy="14.00">Person using Aurora tooling surfaces to browse, edit, validate, and</tspan>
<tspan x="414.26" dy="14.00">render models in a workspace.</tspan>
</text>
</g>
<g class="node card-type-actor" data-card-id="ACT-003" data-layout-node="ACT-003">
