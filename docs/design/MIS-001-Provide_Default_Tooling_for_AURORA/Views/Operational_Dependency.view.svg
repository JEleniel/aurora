<text class="node-icon" x="19.08" y="951.01" text-anchor="start" dominant-baseline="hanging">👤</text>
<text class="node-label" x="77.08" y="958.01" text-anchor="start" dominant-baseline="middle">
<tspan x="77.08">ACT-002: </tspan><tspan font-weight="700">Actor</tspan>
<tspan x="77.08" dy="14.00">User</tspan>
<tspan x="77.08" dy="14.00">&#160;</tspan>
<tspan x="77.08" dy="14.00">Person using Aurora tooling surfaces to browse, edit, validate, and</tspan>
<tspan x="77.08" dy="14.00">render models in a workspace.</tspan>
</text>
</g>
<g class="node card-type-actor" data-card-id="ACT-003" data-layout-node="ACT-003">
