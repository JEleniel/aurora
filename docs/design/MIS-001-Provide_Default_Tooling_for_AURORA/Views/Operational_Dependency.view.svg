<text class="node-icon" x="133.26" y="28.36" text-anchor="start" dominant-baseline="hanging">🧱</text>
<text class="node-label" x="191.26" y="35.36" text-anchor="start" dominant-baseline="middle">
<tspan x="191.26">SYS-001: </tspan><tspan font-weight="700">System</tspan>
<tspan x="191.26" dy="14.00">Default Tooling Platform</tspan>
<tspan x="191.26" dy="14.00">&#160;</tspan>
<tspan x="191.26" dy="14.00">A bounded system that delivers the default Aurora tooling surfaces:</tspan>
<tspan x="191.26" dy="14.00">CLI, Editor, and VSCode Extension.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-001" data-layout-node="THR-001">
<polygon class="node-shape" points="1449.61,667.40 1677.70,725.94 1677.70,808.73 1449.61,867.28 1127.03,867.28 898.94,808.73 898.94,725.94 1127.03,667.40" />
<text class="node-icon" x="876.86" y="732.34" text-anchor="start" dominant-baseline="hanging">🐛</text>
<text class="node-label" x="934.86" y="739.34" text-anchor="start" dominant-baseline="middle">
<tspan x="934.86">THR-001: </tspan><tspan font-weight="700">Threat</tspan>
<tspan x="934.86" dy="14.00">Script Injection via Markdown</tspan>
<tspan x="934.86" dy="14.00">&#160;</tspan>
<tspan x="934.86" dy="14.00">Untrusted content in model descriptions or rendered Markdown could</tspan>
<tspan x="934.86" dy="14.00">inject script or unsafe resources into a webview-based renderer.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-002" data-layout-node="THR-002">
<polygon class="node-shape" points="1449.22,427.40 1676.76,485.94 1676.76,568.73 1449.22,627.28 1127.42,627.28 899.88,568.73 899.88,485.94 1127.42,427.40" />
<text class="node-icon" x="877.88" y="485.34" text-anchor="start" dominant-baseline="hanging">🐛</text>
<text class="node-label" x="935.88" y="492.34" text-anchor="start" dominant-baseline="middle">
<tspan x="935.88">THR-002: </tspan><tspan font-weight="700">Threat</tspan>
<tspan x="935.88" dy="14.00">Path Traversal or Arbitrary Write</tspan>
<tspan x="935.88" dy="14.00">&#160;</tspan>
<tspan x="935.88" dy="14.00">A crafted input path or unsafe write behavior could cause tooling to</tspan>
<tspan x="935.88" dy="14.00">write outside the intended model/workspace directory, overwriting</tspan>
<tspan x="935.88" dy="14.00">unrelated files.</tspan>
</text>
</g>
<g class="node card-type-threat" data-card-id="THR-003" data-layout-node="THR-003">
<polygon class="node-shape" points="1451.17,187.39 1681.47,245.93 1681.47,328.72 1451.17,387.27 1125.47,387.27 895.17,328.72 895.17,245.93 1125.47,187.39" />
<text class="node-icon" x="872.78" y="252.33" text-anchor="start" dominant-baseline="hanging">🐛</text>
<text class="node-label" x="930.78" y="259.33" text-anchor="start" dominant-baseline="middle">
<tspan x="930.78">THR-003: </tspan><tspan font-weight="700">Threat</tspan>
<tspan x="930.78" dy="14.00">Untrusted Workspace Execution or Access</tspan>
<tspan x="930.78" dy="14.00">&#160;</tspan>
<tspan x="930.78" dy="14.00">Operating in an untrusted workspace could allow unsafe operations that</tspan>
<tspan x="930.78" dy="14.00">lead to data exposure or unintended execution paths.</tspan>
</text>
</g>
