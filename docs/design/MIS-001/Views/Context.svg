dle;dominant-baseline:middle;font-size:16px;"></text><text x="364.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Shared Rust library providing registry-aware parsing, validation helpers, and</text><text x="364.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">rendering primitives used by Aurora tools.</text></g><g id="COM-003-label" transform="translate(1656, 20)"><text x="96.73" y="35.28" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;"> </text><text x="352.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Component (API)</text><text x="352.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Tauri Rust Backend</text><text x="352.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="352.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">A trust-gated Rust backend exposing model discovery, snapshot loading,</text><text x="352.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">validation, rendering, exports, and card CRUD operations to the editor UI.</text></g><g id="COM-002-label" transform="translate(12, 20)"><text x="96.73" y="35.28" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;"> </text><text x="352.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Component (Service)</text><text x="352.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Aurora CLI Binary</text><text x="352.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="352.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">The aurora_cli executable that exposes validate/render/compact commands to</text><text x="352.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">users and pipelines.</text></g><g id="INT-001-label" transform="translate(1648, 332)"><text x="98.93" y="35.28" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;"> </text><text x="360.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Interface</text><text x="360.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Editor Backend API</text><text x="360.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="360.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">The interface contract between the editor UI and the Tauri backend for model</text><text x="360.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">operations (discover/load/validate/render/export and card CRUD).</text></g><g id="MIS-001-label" transform="translate(824, 0)"><text x="100.03" y="42.48" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">🎯</text><text x="364.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Mission</text><text x="364.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Model Aurora With Aurora</text><text x="364.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="364.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Define Aurora (Agent-Unified Representation of Requirements and Architecture)</text><text x="364.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">using Aurora itself: a deterministic, machine-consumable architecture model</text><text x="364.00" y="174.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">rooted at a single Mission card, backed by schemas and canonical registries,</text><text x="364.00" y="194.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">and usable by tools and agents.</text></g></g>
