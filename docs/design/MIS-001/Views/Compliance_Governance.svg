<style>@media print{#aurora-bg{display:none;}}</style><rect id="aurora-bg" x="-16" y="-16" width="3112" height="452" style="fill:#ffffff;stroke:none;" /><g id="edges"><path d="M 2744.00 152.00 L 2744.00 278.00" style="fill:none;stroke:#000000;stroke-width:2px;" /><path d="M 2744.00 278.00 L 2739.20 262.00 L 2748.80 262.00 Z" style="fill:#000000;stroke:none;" /><path d="M 1160.00 162.00 L 1160.00 278.00" style="fill:none;stroke:#000000;stroke-width:2px;" /><path d="M 1160.00 278.00 L 1155.20 262.00 L 1164.80 262.00 Z" style="fill:#000000;stroke:none;" /><path d="M 1960.00 152.00 L 1960.00 268.00" style="fill:none;stroke:#000000;stroke-width:2px;" /><path d="M 1960.00 268.00 L 1955.20 252.00 L 1964.80 252.00 Z" style="fill:#000000;stroke:none;" /></g><g id="nodes"><g id="REQ-001" transform="translate(2400, 20)"><g transform="scale(4.250000, 1.320000)"><use href="#rounded-rectangle" style="fill:#065f46;stroke:#FFFFFF;" /></g><text x="24.00" y="32.00" style="font-size:48px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">✅</text><text x="340.00" y="32" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Requirement</text><text x="340.00" y="52" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Single Mission Root</text><text x="340.00" y="72" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="340.00" y="92" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">A model MUST include exactly one Mission card as the root intent, with only</text><text x="340.00" y="112" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">outgoing links, summarizing the high-level why of the model.</text></g><g id="MIS-001" transform="translate(0, 0)"><g transform="scale(4.350000, 1.720000)"><use href="#octagon" style="fill:#022c22;stroke:#FFFFFF;" /></g><text x="24.00" y="32.00" style="font-size:48px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">🎯</text><text x="348.00" y="32" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Mission</text><text x="348.00" y="52" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Model Aurora With Aurora</text><text x="348.00" y="72" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="348.00" y="92" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Define Aurora (Agent-Unified Representation of Requirements and Architecture)</text><text x="348.00" y="112" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">using Aurora itself: a deterministic, machine-consumable architecture model</text><text x="348.00" y="132" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">rooted at a single Mission card, backed by schemas and canonical registries,</text><text x="348.00" y="152" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">and usable by tools and agents.</text></g><g id="CNS-003" transform="translate(1600, 268)"><g transform="scale(4.400000, 1.520000)"><use href="#ruler" style="fill:#082f49;stroke:#FFFFFF;" /></g><text x="24.00" y="32.00" style="font-size:48px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">📏</text><text x="352.00" y="32" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Constraint</text><text x="352.00" y="52" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Standard Model File Layout</text><text x="352.00" y="72" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="352.00" y="92" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Models must use the standard Aurora folder layout: Mission card at model home,</text><text x="352.00" y="112" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">mission-scoped cards under `&lt;MISSION_ID&gt;/&lt;Card Type&gt;/`, and an audit log at</text><text x="352.00" y="132" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">`&lt;MISSION_ID&gt;/AuditLog.json`.</text></g><g id="CNS-001" transform="translate(2408, 278)"><g transform="scale(4.150000, 1.320000)"><use href="#ruler" style="fill:#082f49;stroke:#FFFFFF;" /></g><text x="24.00" y="32.00" style="font-size:48px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">📏</text><text x="332.00" y="32" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Constraint</text><text x="332.00" y="52" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Mission Has Outgoing Links Only</text><text x="332.00" y="72" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="332.00" y="92" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">The Mission card serves as the root of the model graph and must only have</text><text x="332.00" y="112" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">outgoing links.</text></g><g id="CNS-002" transform="translate(804, 278)"><g transform="scale(4.300000, 1.320000)"><use href="#ruler" style="fill:#082f49;stroke:#FFFFFF;" /></g><text x="24.00" y="32.00" style="font-size:48px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">📏</text><text x="344.00" y="32" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Constraint</text><text x="344.00" y="52" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">No Orphan Cards</text><text x="344.00" y="72" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="344.00" y="92" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Every non-Mission card must have one or more incoming links and be reachable</text><text x="344.00" y="112" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">from the Mission card.</text></g><g id="REQ-005" transform="translate(1608, 20)"><g transform="scale(4.300000, 1.320000)"><use href="#rounded-rectangle" style="fill:#065f46;stroke:#FFFFFF;" /></g><text x="24.00" y="32.00" style="font-size:48px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">✅</text><text x="344.00" y="32" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Requirement</text><text x="344.00" y="52" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Standard Model Home Layout</text><text x="344.00" y="72" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="344.00" y="92" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Model homes MUST contain the shared Aurora schemas, and missions MUST follow</text><text x="344.00" y="112" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">the standard folder layout for cards and audit logs.</text></g><g id="REQ-002" transform="translate(792, 10)"><g transform="scale(4.450000, 1.520000)"><use href="#rounded-rectangle" style="fill:#065f46;stroke:#FFFFFF;" /></g><text x="24.00" y="32.00" style="font-size:48px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">✅</text><text x="356.00" y="32" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Requirement</text><text x="356.00" y="52" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Directed Graph Invariants</text><text x="356.00" y="72" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="356.00" y="92" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Starting from the Mission, all links MUST traverse away from the Mission; every</text><text x="356.00" y="112" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">card must be reachable; and traversal must terminate in a leaf or a previously</text><text x="356.00" y="132" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">seen card (local loop).</text></g></g>
</svg>
