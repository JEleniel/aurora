<style>@media print{#aurora-bg{display:none;}}</style><rect id="aurora-bg" x="-16" y="-32" width="3240" height="596" style="fill:#ffffff;stroke:none;" /><g id="edges"><path d="M 1196.00 226.00 L 1196.00 342.00" style="fill:none;stroke:#000000;stroke-width:2px;" /><path d="M 1196.00 342.00 L 1191.20 326.00 L 1200.80 326.00 Z" style="fill:#000000;stroke:none;" /><path d="M 2032.00 216.00 L 2032.00 332.00" style="fill:none;stroke:#000000;stroke-width:2px;" /><path d="M 2032.00 332.00 L 2027.20 316.00 L 2036.80 316.00 Z" style="fill:#000000;stroke:none;" /><path d="M 2852.00 216.00 L 2852.00 342.00" style="fill:none;stroke:#000000;stroke-width:2px;" /><path d="M 2852.00 342.00 L 2847.20 326.00 L 2856.80 326.00 Z" style="fill:#000000;stroke:none;" /></g><g id="node-shapes"><g id="CNS-003" transform="translate(1664, 332)"><g class="aurora-symbol" transform="translate(7.36, 0.00) scale(4.508000, 2.160000)"><use href="#ruler" style="fill:#082f49;stroke:#FFFFFF;" /></g></g><g id="REQ-002" transform="translate(824, 10)"><g class="aurora-symbol" transform="translate(7.44, 0.00) scale(4.557000, 2.160000)"><use href="#rounded-rectangle" style="fill:#065f46;stroke:#FFFFFF;" /></g></g><g id="CNS-002" transform="translate(836, 342)"><g class="aurora-symbol" transform="translate(7.20, 0.00) scale(4.410000, 1.960000)"><use href="#ruler" style="fill:#082f49;stroke:#FFFFFF;" /></g></g><g id="MIS-001" transform="translate(0, 0)"><g class="aurora-symbol" transform="translate(7.28, 0.00) scale(4.459000, 2.360000)"><use href="#octagon" style="fill:#022c22;stroke:#FFFFFF;" /></g></g><g id="CNS-001" transform="translate(2504, 342)"><g class="aurora-symbol" transform="translate(6.96, 0.00) scale(4.263000, 1.960000)"><use href="#ruler" style="fill:#082f49;stroke:#FFFFFF;" /></g></g><g id="REQ-005" transform="translate(1672, 20)"><g class="aurora-symbol" transform="translate(7.20, 0.00) scale(4.410000, 1.960000)"><use href="#rounded-rectangle" style="fill:#065f46;stroke:#FFFFFF;" /></g></g><g id="REQ-001" transform="translate(2496, 20)"><g class="aurora-symbol" transform="translate(7.12, 0.00) scale(4.361000, 1.960000)"><use href="#rounded-rectangle" style="fill:#065f46;stroke:#FFFFFF;" /></g></g></g><g id="node-labels"><g id="CNS-003-label" transform="translate(1664, 332)"><text x="101.13" y="38.88" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">📏</text><text x="368.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Constraint</text><text x="368.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Standard Model File Layout</text><text x="368.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="368.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Models must use the standard Aurora folder layout: Mission card at model home,</text><text x="368.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">mission-scoped cards under `&lt;MISSION_ID&gt;/&lt;Card Type&gt;/`, and an audit log at</text><text x="368.00" y="174.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">`&lt;MISSION_ID&gt;/AuditLog.json`.</text></g><g id="REQ-002-label" transform="translate(824, 10)"><text x="102.23" y="38.88" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">✅</text><text x="372.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Requirement</text><text x="372.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Directed Graph Invariants</text><text x="372.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="372.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Starting from the Mission, all links MUST traverse away from the Mission; every</text><text x="372.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">card must be reachable; and traversal must terminate in a leaf or a previously</text><text x="372.00" y="174.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">seen card (local loop).</text></g><g id="CNS-002-label" transform="translate(836, 342)"><text x="98.93" y="35.28" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">📏</text><text x="360.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Constraint</text><text x="360.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">No Orphan Cards</text><text x="360.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="360.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Every non-Mission card must have one or more incoming links and be reachable</text><text x="360.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">from the Mission card.</text></g><g id="MIS-001-label" transform="translate(0, 0)"><text x="100.03" y="42.48" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">🎯</text><text x="364.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Mission</text><text x="364.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Model Aurora With Aurora</text><text x="364.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="364.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Define Aurora (Agent-Unified Representation of Requirements and Architecture)</text><text x="364.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">using Aurora itself: a deterministic, machine-consumable architecture model</text><text x="364.00" y="174.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">rooted at a single Mission card, backed by schemas and canonical registries,</text><text x="364.00" y="194.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">and usable by tools and agents.</text></g><g id="CNS-001-label" transform="translate(2504, 342)"><text x="95.63" y="35.28" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">📏</text><text x="348.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Constraint</text><text x="348.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Mission Has Outgoing Links Only</text><text x="348.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="348.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">The Mission card serves as the root of the model graph and must only have</text><text x="348.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">outgoing links.</text></g><g id="REQ-005-label" transform="translate(1672, 20)"><text x="98.93" y="35.28" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">✅</text><text x="360.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Requirement</text><text x="360.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Standard Model Home Layout</text><text x="360.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="360.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Model homes MUST contain the shared Aurora schemas, and missions MUST follow</text><text x="360.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">the standard folder layout for cards and audit logs.</text></g><g id="REQ-001-label" transform="translate(2496, 20)"><text x="97.83" y="35.28" style="font-size:44.80px;text-anchor:start;dominant-baseline:hanging;fill:#FFFFFF;stroke:none;">✅</text><text x="356.00" y="74.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">Requirement</text><text x="356.00" y="94.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;font-weight:bold;">Single Mission Root</text><text x="356.00" y="114.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;"></text><text x="356.00" y="134.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">A model MUST include exactly one Mission card as the root intent, with only</text><text x="356.00" y="154.00" style="fill:#FFFFFF;stroke:none;text-anchor:middle;dominant-baseline:middle;font-size:16px;">outgoing links, summarizing the high-level why of the model.</text></g></g>
</svg>
