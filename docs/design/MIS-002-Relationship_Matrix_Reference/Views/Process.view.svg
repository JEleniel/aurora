<tspan x="1456.03" dy="14.00">&#160;</tspan>
<tspan x="1456.03" dy="14.00">Reference Activity — Activity that receives an event and</tspan>
<tspan x="1456.03" dy="14.00">triggers downstream activities, events, conditions, actors,</tspan>
<tspan x="1456.03" dy="14.00">and states.</tspan>
</text>
