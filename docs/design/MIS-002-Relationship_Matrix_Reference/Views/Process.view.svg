<tspan x="291.66" dy="14.00">&#160;</tspan>
<tspan x="291.66" dy="14.00">Reference Capability — Capability used to satisfy a requirement</tspan>
<tspan x="291.66" dy="14.00">and to run both a process and a state machine.</tspan>
