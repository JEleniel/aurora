<tspan x="316.33" font-weight="700">Capability</tspan>
<tspan x="316.33" dy="14.00" font-weight="700">CAP-010</tspan>
<tspan x="316.33" dy="14.00">&#160;</tspan>
<tspan x="316.33" dy="14.00">Navigation and Focus Management — Ability to navigate the model by</tspan>
<tspan x="316.33" dy="14.00">card id and keep the focused card synchronized across panes.</tspan>
</text>
</g>
<g class="node card-type-capability" data-card-id="CAP-011" data-layout-node="CAP-011">
