<tspan x="316.33" font-weight="700">Capability</tspan>
<tspan x="316.33" dy="14.00" font-weight="700">CAP-009</tspan>
<tspan x="316.33" dy="14.00">&#160;</tspan>
<tspan x="316.33" dy="14.00">Desktop UI Shell — Ability to present a desktop application UI</tspan>
<tspan x="316.33" dy="14.00">with a stable three-pane layout and shared selection state.</tspan>
</text>
</g>
<g class="node card-type-capability" data-card-id="CAP-010" data-layout-node="CAP-010">
