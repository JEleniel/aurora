<tspan x="303.66" dy="14.00">&#160;</tspan>
<tspan x="303.66" dy="14.00">aurora_editor — Standalone desktop application (built with Dioxus)</tspan>
<tspan x="303.66" dy="14.00">for browsing and editing Aurora models, including live validation and</tspan>
<tspan x="303.66" dy="14.00">Markdown-style previews.</tspan>
</text>
