<tspan x="983.67" dy="14.00" font-weight="700">COM-008</tspan>
<tspan x="983.67" dy="14.00">&#160;</tspan>
<tspan x="983.67" dy="14.00">Explorer Tree Pane — Left navigation pane that presents a tree view</tspan>
