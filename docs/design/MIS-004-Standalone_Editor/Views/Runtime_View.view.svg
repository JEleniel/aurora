<tspan x="290.34" dy="14.00" font-weight="700">APP-004</tspan>
<tspan x="290.34" dy="14.00">&#160;</tspan>
<tspan x="290.34" dy="14.00">aurora_editor — Standalone desktop application (built with</tspan>
<tspan x="290.34" dy="14.00">Dioxus) for browsing and editing Aurora models, including live</tspan>
<tspan x="290.34" dy="14.00">validation and Markdown-style previews.</tspan>
</text>
</g>
