<tspan x="347.67" dy="14.00">&#160;</tspan>
<tspan x="347.67" dy="14.00">Aurora Compact Schema — The canonical JSON Schema that defines</tspan>
<tspan x="347.67" dy="14.00">compact, agent-friendly exports (AGENT-&lt;MISSION_ID&gt;.jsjson) which omit</tspan>
