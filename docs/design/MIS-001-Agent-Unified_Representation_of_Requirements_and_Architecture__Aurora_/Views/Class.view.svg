<tspan x="347.67" font-weight="700">Artifact</tspan>
<tspan x="347.67" dy="14.00" font-weight="700">ART-006</tspan>
<tspan x="347.67" dy="14.00">&#160;</tspan>
<tspan x="347.67" dy="14.00">Aurora Card Schema — The canonical JSON Schema that defines the</tspan>
<tspan x="347.67" dy="14.00">required structure for full Aurora card files (including audit_trail).</tspan>
<tspan x="347.67" dy="14.00">In this repository it is stored at</tspan>
<tspan x="347.67" dy="14.00">docs/design/aurora/Aurora.schema.jsjson.</tspan>
</text>
</g>
