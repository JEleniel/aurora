<rect x="16.00" y="6.51" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="22.51" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="6.51" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="-6.29" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Requirement&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="12.91" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Discover and Load Models&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="32.11" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;BR /&gt;</text><text x="22.00" y="51.31" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">The tooling SHALL discover one or more Aurora model homes from an input path (file, model-home directory, or ancestor directory) and load all card files under each model home. Discovery is schema-based (presence of Aurora.schema.*), supports a direct child &amp;apos;aurora/&amp;apos; folder, and bounds directory walking (max depth) for predictable performance.</text><rect x="16.00" y="6.51" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="-6.29" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Requirement&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="12.91" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Validate Models and Emit Diagnostics&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="32.11" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;BR /&gt;</text><text x="22.00" y="51.31" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">The tooling SHALL validate loaded models for core invariants (unique ids, at least one Mission, valid link targets, reachability from the mission root) and SHALL emit structured diagnostics with severity (error|warning|info). Validation SHALL fail the command when errors are present and SHOULD still surface warnings (e.g., relationship matrix compliance).</text><rect x="16.00" y="6.51" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="-6.29" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Requirement&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="12.91" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Render Card Markdown&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="32.11" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;BR /&gt;</text><text x="22.00" y="51.31" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">The tooling SHALL render per-card Markdown documentation and a mission executive summary into a user-specified output directory. Rendered files SHOULD mirror the source card layout (card-type subfolders) and MUST be produced only after the model validates without errors.</text><rect x="16.00" y="6.51" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="-6.29" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Requirement&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="12.91" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Render View Diagrams&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="32.11" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;BR /&gt;</text><text x="22.00" y="51.31" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">The tooling SHALL render view diagrams (DOT sources plus SVG output) for the canonical view set. Rendering MUST use a Graphviz-compatible DOT renderer (default &amp;apos;dot&amp;apos;) and SHOULD allow overriding the executable via environment configuration (AURORA_DOT_COMMAND).</text><rect x="16.00" y="6.51" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="-6.29" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Requirement&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="12.91" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Write Compact Agent Export&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="32.11" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;BR /&gt;</text><text x="22.00" y="51.31" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">The tooling SHALL generate a single-file compact export suitable for agent consumption (AGENT-&amp;lt;MISSION_ID&amp;gt;.jsjson by default) by removing non-essential fields (e.g., $schema, audit trail metadata) while preserving the card graph structure.</text><rect x="16.00" y="6.51" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="-6.29" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Requirement&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="12.91" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Bump Model Audit Versions&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="32.11" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;BR /&gt;</text><text x="22.00" y="51.31" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">The CLI SHOULD support bumping model audit trail versions (patch, minor, major) with deterministic edits to affected cards and an appended audit history entry. The current aurora_cli surface exposes bump commands but does not yet implement them.</text><rect x="16.00" y="6.51" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="-6.29" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Requirement&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="12.91" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Embed Canonical Registries&lt;/B&gt;&lt;BR /&gt;</text><text x="22.00" y="32.11" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">&lt;BR /&gt;</text><text x="22.00" y="51.31" text-anchor="start" font-family="&quot;Noto Sans&quot;, Roboto, Verdana, system-ui, sans-serif" font-size="16.00" fill="#111827" dominant-baseline="middle">The tooling SHALL embed canonical registries for card types, relationship verbs, and view definitions so validation and rendering can operate deterministically without depending on external instruction files at runtime.</text></svg>