<rect x="16.00" y="113.31" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="96.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="110.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Model Validation&lt;/B&gt;</text><text x="22.00" y="125.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to validate Aurora model invariants and provide actionable diagnostics b</text><text x="22.00" y="139.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">efore any downstream rendering/export steps.</text><text x="22.00" y="154.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="113.31" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="96.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="110.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Model Discovery and Loading&lt;/B&gt;</text><text x="22.00" y="125.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to locate Aurora model homes from a user-provided path and load all card</text><text x="22.00" y="139.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">JSON/JSJSON files into an indexed in-memory model.</text><t