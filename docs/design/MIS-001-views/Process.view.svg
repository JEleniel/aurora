<use href="#rounded-rectangle" x="376.47" y="144.39" width="116.28" height="18.07" fill="#052e16" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="440.47" y="153.43" font-size="48">✨</text><text x="434.61" y="117.43" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="434.61" y="131.83" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Model Layout and Serialization&lt;/B&gt;</text><text x="434.61" y="146.23" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to persist Aurora cards in a stable, tooling-friendly directory and file</text><text x="434.61" y="160.63" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">name layout, with schema references and encoding rules suitable for reliable dif</text><text x="434.61" y="175.03" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">fs and automated ingestion.</text><text x="434.61" y="189.43" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#rounded-rectangle" x="1227.15" y="145.77" width="114.90" height="15.32" fill="#052e16" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="1291.15" y="153.43" font-size="48">✨</text><text x="1284.60" y="124.63" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="1284.60" y="139.03" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;View Projection and Rendering&lt;/B&gt;</text><text x="1284.60" y="153.43" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to select card types for a view and render the resulting subgraph as nav</text><text x="1284.60" y="167.83" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">igable documentation and diagrams without altering the underlying model.</text><text x="1284.60" y="182.23" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#rounded-rectangle" x="2075.66" y="144.39" width="115.89" height="18.07" fill="#052e16" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="2139.66" y="153.43" font-size="48">✨</text><text x="2133.60" y="117.43" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="2133.60" y="131.83" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Canonical Registries&lt;/B&gt;</text><text x="2133.60" y="146.23" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to define and distribute canonical registries for card types, relationsh</text><text x="2133.60" y="160.63" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">ip verbs, and views so multiple tools produce consistent validation and renderin</text><text x="2133.60" y="175.03" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">gs.</text><text x="2133.60" y="189.43" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#rounded-rectangle" x="2921.64" y="145.77" width="113.92" height="15.32" fill="#052e16" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="2985.64" y="153.43" font-size="48">✨</text><text x="2978.60" y="124.63" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="2978.60" y="139.03" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Deterministic Model Invariants&lt;/B&gt;</text><text x="2978.60" y="153.43" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to define and enforce mission-rooted graph invariants so any tool can tr</text><text x="2978.60" y="167.83" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">averse, validate, and interpret the model deterministically.</text><text x="2978.60" y="182.23" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#box" x="301.12" y="284.98" width="14.98" height="5.00" fill="#00000000" stroke="#FFF000000FFF" stroke-width="2.00" /><text x="308.61" y="287.48" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><use href="#box" x="427.12" y="284.98" width="14.98" height="5.00" fill="#00000000" stroke="#FFF000000FFF" stroke-width="2.00" /><text x="434.61" y="287.48" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><use href="#box" x="553.12" y="284.98" width="14.98" height="5.00" fill="#00000000" stroke="#FFF000000FFF" stroke-width="2.00" /><text x="560.61" y="287.48" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><use href="#box" x="1277.11" y="284.98" width="14.98" height="5.00" fill="#00000000" stroke="#FFF000000FFF" stroke-width="2.00" /><text x="1284.60" y="287.48" te