<rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="116.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="130.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;View Projection and Rendering&lt;/B&gt;</text><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to select card types for a view and render the resulting subgraph as nav</text><text x="22.00" y="159.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">igable documentation and diagrams without altering the underlying model.</text><text x="22.00" y="173.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="116.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="130.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Deterministic Model Invariants&lt;/B&gt;</text><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to define and enforce mission-rooted graph invariants so any tool can tr</text><text x="22.00" y="159.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">averse, validate, and interpret the model deterministically.</text><text x="22.00" y="173.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="109.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="123.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Model Layout and Serialization&lt;/B&gt;</text><text x="22.00" y="137.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to persist Aurora cards in a stable, tooling-friendly directory and file</text><text x="22.00" y="152.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">name layout, with schema references and encoding rules suitable for reliable dif</text><text x="22.00" y="166.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">fs and automated ingestion.</text><text x="22.00" y="181.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="109.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="123.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Canonical Registries&lt;/B&gt;</text><text x="22.00" y="137.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to define and distribute canonical registries for card types, relationsh</text><text x="22.00" y="152.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">ip verbs, and views so multiple tools produce consistent validation and renderin</text><text x="22.00" y="166.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">gs.</text><text x="22.00" y="181.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00"