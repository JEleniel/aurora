<rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="116.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="130.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Markdown Preview and Audit View&lt;/B&gt;</text><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to render the focused card as a readable Markdown-style document with li</text><text x="22.00" y="159.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">nk list, and to inspect audit trail history.</text><text x="22.00" y="173.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="116.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="130.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Context Graph Visualization&lt;/B&gt;</text><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to visualize a local subgraph around the focused card (including parent,</text><text x="22.00" y="159.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">siblings, and children) and navigate by clicking nodes.</text><text x="22.00" y="173.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="109.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="123.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;aurora_shared Integration&lt;/B&gt;</text><text x="22.00" y="137.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to reuse aurora_shared for model discovery/loading, validation, renderin</text><text x="22.00" y="152.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">g, and file layout conventions to keep editor behavior consistent with CLI tooli</text><text x="22.00" y="166.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">ng.</text><text x="22.00" y="181.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="116.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="130.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Interactive Card Editing&lt;/B&gt;</text><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to edit card fields and links interactively while maintaining model inva</text><text x="22.00" y="159.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">riants and persisting changes safely.</text><text x="22.00" y="173.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="116.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="130.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Desktop UI Shell&lt;/B&gt;</text><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to present a desktop application UI with a stable three-pane layout and</text><text x="22.00" y="159.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">shared selection state.</text><text x="22.00" y="173.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="116.31" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Capability&lt;/B&gt;</text><text x="22.00" y="130.71" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Navigation and Focus Management&lt;/B&gt;</text><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">Ability to navigate the model by card id and keep the focused card synchronized</text><text x="22.00" y="159.51" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">across panes.</text><text x="22.00" y="173.91" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="133.11" width="100.00" height="100.00" fill="none" stroke="#FFF000000FFF" stroke-width="2.00" stroke-dasharray="5 5" /><text x="22.00" y="145.11" text-anchor="start" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">\N</text><rect x="16.00" y="133.