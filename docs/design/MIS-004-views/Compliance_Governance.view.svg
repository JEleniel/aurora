<use href="#rounded-rectangle" x="386.21" y="133.27" width="119.42" height="15.32" fill="#065f46" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="450.21" y="140.93" font-size="48">☑️</text><text x="445.92" y="112.13" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Requirement&lt;/B&gt;</text><text x="445.92" y="126.53" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Reuse aurora_shared&lt;/B&gt;</text><text x="445.92" y="140.93" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">The editor SHALL reuse aurora_shared for model discovery/loading and validation/</text><text x="445.92" y="155.33" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">rendering semantics to stay consistent with other Aurora tooling.</text><text x="445.92" y="169.73" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#rounded-rectangle" x="1252.96" y="133.27" width="115.89" height="15.32" fill="#065f46" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="1316.96" y="140.93" font-size="48">☑️</text><text x="1310.90" y="112.13" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Requirement&lt;/B&gt;</text><text x="1310.90" y="126.53" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Shortest Path Tree Navigation&lt;/B&gt;</text><text x="1310.90" y="140.93" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">The editor SHALL provide a left-pane tree view for navigation, where the tree is</text><text x="1310.90" y="155.33" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">derived from a chosen shortest path from the mission root to each card.</text><text x="1310.90" y="169.73" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#rounded-rectangle" x="2120.50" y="130.52" width="120.80" height="20.82" fill="#065f46" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="2184.50" y="140.93" font-size="48">☑️</text><text x="2180.90" y="97.73" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Requirement&lt;/B&gt;</text><text x="2180.90" y="112.13" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Brain Style Graph Navigation&lt;/B&gt;</text><text x="2180.90" y="126.53" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">The editor SHALL provide a central mind-map / TheBrain style view with the focus</text><text x="2180.90" y="140.93" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">ed card centered. The view SHALL show the parent (from the chosen shortest-path</text><text x="2180.90" y="155.33" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">chain), and MAY show siblings (same card_type) linked from that parent even if t</text><text x="2180.90" y="169.73" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">hey are not linked to the focused card.</text><text x="2180.90" y="184.13" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#rounded-rectangle" x="3016.22" y="133.27" width="123.35" height="15.32" fill="#065f46" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="3080.22" y="140.93" font-size="48">☑️</text><text x="3077.90" y="112.13" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Requirement&lt;/B&gt;</text><text x="3077.90" y="126.53" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Dioxus UI&lt;/B&gt;</text><text x="3077.90" y="140.93" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">The standalone editor SHOULD be implemented using Dioxus as the primary UI libra</text><text x="3077.90" y="155.33" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">ry.</text><text x="3077.90" y="169.73" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#rounded-rectangle" x="3900.66" y="131.89" width="116.48" height="18.07" fill="#065f46" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="3964.66" y="140.93" font-size="48">☑️</text><text x="3958.90" y="104.93" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Requirement&lt;/B&gt;</text><text x="3958.90" y="119.33" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Edit, Preview, and Audit Inspector&lt;/B&gt;</text><text x="3958.90" y="133.73" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">The editor SHALL provide a right-pane inspector: the top half edits the focused</text><text x="3958.90" y="148.13" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">card; the bottom half renders a Markdown-style view of the card (including links</text><text x="3958.90" y="162.53" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">). The bottom half SHALL provide a tab to reveal the card’s audit trail details.</text><text x="3958.90" y="176.93" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#rounded-rectangle" x="4757.66" y="133.27" width="116.48" height="15.32" fill="#065f46" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="4821.66" y="140.93" font-size="48">☑️</text><text x="4815.90" y="112.13" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Requirement&lt;/B&gt;</text><text x="4815.90" y="126.53" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Three Pane Layout&lt;/B&gt;</text><text x="4815.90" y="140.93" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">The editor SHALL present a three-pane layout (similar to Visual Studio or Obsidi</text><text x="4815.90" y="155.33" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">an): left navigation tree, central graph view, and right inspector.</text><text x="4815.90" y="169.73" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text><use href="#rounded-rectangle" x="5609.45" y="133.27" width="114.90" height="15.32" fill="#065f46" stroke="#FFF000000FFF" stroke-width="2.00" />
<text x="5673.45" y="140.93" font-size="48">☑️</text><text x="5666.90" y="112.13" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;FONT COLOR=&quot;#FFFFFF&quot;&gt;&lt;B&gt;Requirement&lt;/B&gt;</text><text x="5666.90" y="126.53" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;B&gt;Safe Workspace Persistence&lt;/B&gt;</text><text x="5666.90" y="140.93" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">The editor SHALL persist edits to model files in a safe manner that avoids parti</text><text x="5666.90" y="155.33" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">al writes and preserves schema validity (e.g., atomic replace per card file).</text><text x="5666.90" y="169.73" text-anchor="middle" font-family="Noto Sans" font-size="12.00" fill="#111827" dominant-baseline="middle">&lt;/FONT&gt;</text></svg>