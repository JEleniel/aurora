<text class="node-icon" x="54.33" y="367.33" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🪟</text>
<text class="node-label" x="304.33" y="332.33" text-anchor="middle" dominant-baseline="middle">
<tspan x="304.33" font-weight="700">Application</tspan>
<tspan x="304.33" dy="14.00" font-weight="700">APP-003</tspan>
<tspan x="304.33" dy="14.00">&#160;</tspan>
<tspan x="304.33" dy="14.00">aurora_shared — Shared domain library that implements model</tspan>
<tspan x="304.33" dy="14.00">discovery, parsing, validation, rendering, and compact export</tspan>
<tspan x="304.33" dy="14.00">helpers for Aurora tooling surfaces.</tspan>
</text>
</g>
