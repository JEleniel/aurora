<path class="node-shape node-shape-outline" d="M 672.00 765.33 L 1172.00 765.33 L 1172.00 905.33" />
<text class="node-icon" x="713.00" y="835.33" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="955.00" y="793.33" text-anchor="middle" dominant-baseline="middle">
<tspan x="955.00" font-weight="700">Component</tspan>
<tspan x="955.00" dy="14.00" font-weight="700">COM-002</tspan>
<tspan x="955.00" dy="14.00">&#160;</tspan>
<tspan x="955.00" dy="14.00">CLI Command Runner — CLI entrypoint and command dispatcher</tspan>
<tspan x="955.00" dy="14.00">(clap subcommands) that orchestrates discovery, validation,</tspan>
<tspan x="955.00" dy="14.00">rendering, and compact export workflows and reports diagnostics</tspan>
<tspan x="955.00" dy="14.00">and summaries.</tspan>
</text>
</g>
