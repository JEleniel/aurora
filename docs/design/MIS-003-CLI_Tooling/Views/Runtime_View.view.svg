<tspan x="955.00" font-weight="700">Component</tspan>
<tspan x="955.00" dy="14.00" font-weight="700">COM-005</tspan>
<tspan x="955.00" dy="14.00">&#160;</tspan>
<tspan x="955.00" dy="14.00">Rendering Engine — Renderer that produces per-card Markdown</tspan>
