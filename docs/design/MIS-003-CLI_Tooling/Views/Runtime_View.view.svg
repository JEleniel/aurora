<path class="node-shape node-shape-outline" d="M 671.34 8.00 L 1172.67 8.00 L 1172.67 148.00" />
<text class="node-icon" x="712.34" y="78.00" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="955.00" y="36.00" text-anchor="middle" dominant-baseline="middle">
<tspan x="955.00" font-weight="700">Component</tspan>
<tspan x="955.00" dy="14.00" font-weight="700">COM-003</tspan>
<tspan x="955.00" dy="14.00">&#160;</tspan>
<tspan x="955.00" dy="14.00">Model Discovery and Loading — Discovery and parsing layer that</tspan>
<tspan x="955.00" dy="14.00">locates model homes (schema-based), loads card files</tspan>
<tspan x="955.00" dy="14.00">(JSON/JSJSON) from disk, and builds a searchable AuroraModel</tspan>
<tspan x="955.00" dy="14.00">index.</tspan>
</text>
</g>
<g class="node card-type-component" data-card-id="COM-004" data-layout-node="COM-004">
