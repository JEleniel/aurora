<text class="node-label" x="955.00" y="229.33" text-anchor="middle" dominant-baseline="middle">
<tspan x="955.00" font-weight="700">Component</tspan>
<tspan x="955.00" dy="14.00" font-weight="700">COM-004</tspan>
<tspan x="955.00" dy="14.00">&#160;</tspan>
<tspan x="955.00" dy="14.00">Validation Engine — Validator that checks structural</tspan>
<tspan x="955.00" dy="14.00">invariants (duplicate ids, mission presence, link targets,</tspan>
<tspan x="955.00" dy="14.00">reachability) plus policy checks (secret asset ownership) and</tspan>
<tspan x="955.00" dy="14.00">relationship-matrix compliance using embedded registries.</tspan>
</text>
</g>
