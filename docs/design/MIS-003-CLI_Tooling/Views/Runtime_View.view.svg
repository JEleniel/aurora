<text class="node-label" x="304.33" y="800.33" text-anchor="middle" dominant-baseline="middle">
<tspan x="304.33" font-weight="700">Application</tspan>
<tspan x="304.33" dy="14.00" font-weight="700">APP-002</tspan>
<tspan x="304.33" dy="14.00">&#160;</tspan>
<tspan x="304.33" dy="14.00">aurora_cli — Command-line interface that discovers Aurora model</tspan>
<tspan x="304.33" dy="14.00">homes, validates mission-scoped models, renders Markdown + SVG views,</tspan>
<tspan x="304.33" dy="14.00">and writes compact agent exports.</tspan>
</text>
</g>
<g class="node card-type-application" data-card-id="APP-003" data-layout-node="APP-003">
