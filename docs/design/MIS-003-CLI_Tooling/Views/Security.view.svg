<text class="node-label" x="419.02" y="953.70" text-anchor="middle" dominant-baseline="middle">
<tspan x="419.02" font-weight="700">Actor</tspan>
<tspan x="419.02" dy="14.00" font-weight="700">ACT-003</tspan>
<tspan x="419.02" dy="14.00">&#160;</tspan>
<tspan x="419.02" dy="14.00">Architect — Human operator responsible for authoring Aurora models and</tspan>
<tspan x="419.02" dy="14.00">running CLI tooling (validate, render, compact) to maintain</tspan>
<tspan x="419.02" dy="14.00">deterministic design artifacts.</tspan>
</text>
