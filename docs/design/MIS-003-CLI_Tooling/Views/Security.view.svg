<text class="node-icon" x="172.94" y="792.70" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="424.27" y="757.70" text-anchor="middle" dominant-baseline="middle">
<tspan x="424.27" font-weight="700">Component</tspan>
<tspan x="424.27" dy="14.00" font-weight="700">COM-002</tspan>
<tspan x="424.27" dy="14.00">&#160;</tspan>
<tspan x="424.27" dy="14.00">CLI Command Runner — CLI entrypoint and command dispatcher (clap</tspan>
<tspan x="424.27" dy="14.00">subcommands) that orchestrates discovery, validation, rendering, and</tspan>
<tspan x="424.27" dy="14.00">compact export workflows and reports diagnostics and summaries.</tspan>
</text>
</g>
<g class="node card-type-component" data-card-id="COM-003" data-layout-node="COM-003">
<rect class="node-shape" x="118.60" y="540.04" width="545.34" height="156.00" rx="6.00" ry="6.00" />
<path class="node-shape node-shape-outline" d="M 126.60 548.04 L 655.94 548.04 L 655.94 688.04" />
<text class="node-icon" x="167.60" y="618.04" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="424.27" y="583.04" text-anchor="middle" dominant-baseline="middle">
<tspan x="424.27" font-weight="700">Component</tspan>
<tspan x="424.27" dy="14.00" font-weight="700">COM-003</tspan>
<tspan x="424.27" dy="14.00">&#160;</tspan>
<tspan x="424.27" dy="14.00">Model Discovery and Loading — Discovery and parsing layer that</tspan>
<tspan x="424.27" dy="14.00">locates model homes (schema-based), loads card files (JSON/JSJSON)</tspan>
<tspan x="424.27" dy="14.00">from disk, and builds a searchable AuroraModel index.</tspan>
</text>
</g>
