<text class="node-label" x="424.27" y="217.70" text-anchor="middle" dominant-baseline="middle">
<tspan x="424.27" font-weight="700">Component</tspan>
<tspan x="424.27" dy="14.00" font-weight="700">COM-005</tspan>
<tspan x="424.27" dy="14.00">&#160;</tspan>
<tspan x="424.27" dy="14.00">Rendering Engine — Renderer that produces per-card Markdown</tspan>
<tspan x="424.27" dy="14.00">documentation, executive summaries, canonical view DOT sources, and</tspan>
<tspan x="424.27" dy="14.00">themed SVG diagrams; also writes compact agent exports.</tspan>
</text>
</g>
