<tspan x="424.27" font-weight="700">Component</tspan>
<tspan x="424.27" dy="14.00" font-weight="700">COM-006</tspan>
<tspan x="424.27" dy="14.00">&#160;</tspan>
<tspan x="424.27" dy="14.00">Embedded Registries — Compile-time canonical registries for card</tspan>
