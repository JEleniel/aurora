<text class="node-icon" x="172.94" y="435.37" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="424.27" y="393.37" text-anchor="middle" dominant-baseline="middle">
<tspan x="424.27" font-weight="700">Component</tspan>
<tspan x="424.27" dy="14.00" font-weight="700">COM-004</tspan>
<tspan x="424.27" dy="14.00">&#160;</tspan>
<tspan x="424.27" dy="14.00">Validation Engine — Validator that checks structural invariants</tspan>
<tspan x="424.27" dy="14.00">(duplicate ids, mission presence, link targets, reachability) plus</tspan>
<tspan x="424.27" dy="14.00">policy checks (secret asset ownership) and relationship-matrix</tspan>
<tspan x="424.27" dy="14.00">compliance using embedded registries.</tspan>
</text>
</g>
