<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
  <path d="M 0 0 L 10 5 L 0 10 z" class="edge-arrow" />
</marker>
</defs>
<rect class="bg" x="0" y="0" width="100%" height="100%" />
<g class="node card-type-requirement" data-card-id="REQ-002" data-layout-node="REQ-002">
<rect class="node-shape" x="16.00" y="1240.00" width="568.00" height="200.00" rx="6" ry="6" />
<text class="node-icon" x="65.00" y="1340.00" text-anchor="middle" dominant-baseline="middle" font-size="42.00">☑️</text>
<text class="node-label" x="333.00" y="1284.00" text-anchor="middle" dominant-baseline="middle">
<tspan x="333.00" font-weight="700">Requirement</tspan>
<tspan x="333.00" dy="14.00" font-weight="700">REQ-002</tspan>
<tspan x="333.00" dy="14.00">&#160;</tspan>
<tspan x="333.00" dy="14.00">Discover and Load Models — The tooling SHALL discover one or more</tspan>
<tspan x="333.00" dy="14.00">Aurora model homes from an input path (file, model-home directory, or</tspan>
<tspan x="333.00" dy="14.00">ancestor directory) and load all card files under each model home.</tspan>
<tspan x="333.00" dy="14.00">Discovery is schema-based (presence of Aurora.schema.*), supports a</tspan>
<tspan x="333.00" dy="14.00">direct child 'aurora/' folder, and bounds directory walking (max depth)</tspan>
<tspan x="333.00" dy="14.00">for predictable performance.</tspan>
</text>
</g>
<g class="node card-type-requirement" data-card-id="REQ-003" data-layout-node="REQ-003">
<rect class="node-shape" x="19.33" y="1006.00" width="561.33" height="214.67" rx="6" ry="6" />
<text class="node-icon" x="68.33" y="1113.33" text-anchor="middle" dominant-baseline="middle" font-size="42.00">☑️</text>
<text class="node-label" x="333.00" y="1057.33" text-anchor="middle" dominant-baseline="middle">
<tspan x="333.00" font-weight="700">Requirement</tspan>
<tspan x="333.00" dy="14.00" font-weight="700">REQ-003</tspan>
<tspan x="333.00" dy="14.00">&#160;</tspan>
<tspan x="333.00" dy="14.00">Validate Models and Emit Diagnostics — The tooling SHALL validate</tspan>
<tspan x="333.00" dy="14.00">loaded models for core invariants (unique ids, at least one Mission,</tspan>
<tspan x="333.00" dy="14.00">valid link targets, reachability from the mission root) and SHALL emit</tspan>
<tspan x="333.00" dy="14.00">structured diagnostics with severity (error|warning|info). Validation</tspan>
<tspan x="333.00" dy="14.00">SHALL fail the command when errors are present and SHOULD still surface</tspan>
<tspan x="333.00" dy="14.00">warnings (e.g., relationship matrix compliance).</tspan>
</text>
</g>
<g class="node card-type-requirement" data-card-id="REQ-004" data-layout-node="REQ-004">
<rect class="node-shape" x="11.33" y="801.99" width="577.33" height="185.34" rx="6" ry="6" />
<text class="node-icon" x="60.33" y="894.66" text-anchor="middle" dominant-baseline="middle" font-size="42.00">☑️</text>
<text class="node-label" x="333.00" y="845.66" text-anchor="middle" dominant-baseline="middle">
<tspan x="333.00" font-weight="700">Requirement</tspan>
<tspan x="333.00" dy="14.00" font-weight="700">REQ-004</tspan>
<tspan x="333.00" dy="14.00">&#160;</tspan>
<tspan x="333.00" dy="14.00">Render Card Markdown — The tooling SHALL render per-card Markdown</tspan>
<tspan x="333.00" dy="14.00">documentation and a mission executive summary into a user-specified</tspan>
<tspan x="333.00" dy="14.00">output directory. Rendered files SHOULD mirror the source card layout</tspan>
<tspan x="333.00" dy="14.00">(card-type subfolders) and MUST be produced only after the model</tspan>
<tspan x="333.00" dy="14.00">validates without errors.</tspan>
</text>
</g>
<g class="node card-type-requirement" data-card-id="REQ-005" data-layout-node="REQ-005">
<rect class="node-shape" x="14.67" y="597.99" width="570.66" height="185.34" rx="6" ry="6" />
<text class="node-icon" x="63.67" y="690.66" text-anchor="middle" dominant-baseline="middle" font-size="42.00">☑️</text>
<text class="node-label" x="333.00" y="641.66" text-anchor="middle" dominant-baseline="middle">
<tspan x="333.00" font-weight="700">Requirement</tspan>
<tspan x="333.00" dy="14.00" font-weight="700">REQ-005</tspan>
<tspan x="333.00" dy="14.00">&#160;</tspan>
<tspan x="333.00" dy="14.00">Render View Diagrams — The tooling SHALL render view diagrams (DOT</tspan>
<tspan x="333.00" dy="14.00">sources plus SVG output) for the canonical view set. Rendering MUST use</tspan>
<tspan x="333.00" dy="14.00">a Graphviz-compatible DOT renderer (default 'dot') and SHOULD allow</tspan>
<tspan x="333.00" dy="14.00">overriding the executable via environment configuration</tspan>
<tspan x="333.00" dy="14.00">(AURORA_DOT_COMMAND).</tspan>
</text>
</g>
<g class="node card-type-requirement" data-card-id="REQ-006" data-layout-node="REQ-006">
<rect class="node-shape" x="19.33" y="393.99" width="561.33" height="185.34" rx="6" ry="6" />
<text class="node-icon" x="68.33" y="486.66" text-anchor="middle" dominant-baseline="middle" font-size="42.00">☑️</text>
<text class="node-label" x="333.00" y="444.66" text-anchor="middle" dominant-baseline="middle">
<tspan x="333.00" font-weight="700">Requirement</tspan>
<tspan x="333.00" dy="14.00" font-weight="700">REQ-006</tspan>
<tspan x="333.00" dy="14.00">&#160;</tspan>
<tspan x="333.00" dy="14.00">Write Compact Agent Export — The tooling SHALL generate a single-file</tspan>
<tspan x="333.00" dy="14.00">compact export suitable for agent consumption (AGENT-&lt;MISSION_ID&gt;.jsjson</tspan>
<tspan x="333.00" dy="14.00">by default) by removing non-essential fields (e.g., $schema, audit trail</tspan>
<tspan x="333.00" dy="14.00">metadata) while preserving the card graph structure.</tspan>
</text>
</g>
<g class="node card-type-requirement" data-card-id="REQ-007" data-layout-node="REQ-007">
<rect class="node-shape" x="0.00" y="189.96" width="600.00" height="185.34" rx="6" ry="6" />
<text class="node-icon" x="49.00" y="282.62" text-anchor="middle" dominant-baseline="middle" font-size="42.00">☑️</text>
<text class="node-label" x="333.00" y="233.62" text-anchor="middle" dominant-baseline="middle">
<tspan x="333.00" font-weight="700">Requirement</tspan>
<tspan x="333.00" dy="14.00" font-weight="700">REQ-007</tspan>
<tspan x="333.00" dy="14.00">&#160;</tspan>
<tspan x="333.00" dy="14.00">Bump Model Audit Versions — The CLI SHOULD support bumping model audit</tspan>
<tspan x="333.00" dy="14.00">trail versions (patch, minor, major) with deterministic edits to</tspan>
<tspan x="333.00" dy="14.00">affected cards and an appended audit history entry. The current</tspan>
<tspan x="333.00" dy="14.00">aurora_cli surface exposes bump commands but does not yet implement</tspan>
<tspan x="333.00" dy="14.00">them.</tspan>
</text>
</g>
<g class="node card-type-requirement" data-card-id="REQ-008" data-layout-node="REQ-008">
<rect class="node-shape" x="22.00" y="0.01" width="556.00" height="170.67" rx="6" ry="6" />
<text class="node-icon" x="71.00" y="85.34" text-anchor="middle" dominant-baseline="middle" font-size="42.00">☑️</text>
<text class="node-label" x="333.00" y="43.34" text-anchor="middle" dominant-baseline="middle">
<tspan x="333.00" font-weight="700">Requirement</tspan>
<tspan x="333.00" dy="14.00" font-weight="700">REQ-008</tspan>
<tspan x="333.00" dy="14.00">&#160;</tspan>
<tspan x="333.00" dy="14.00">Embed Canonical Registries — The tooling SHALL embed canonical</tspan>
<tspan x="333.00" dy="14.00">registries for card types, relationship verbs, and view definitions so</tspan>
<tspan x="333.00" dy="14.00">validation and rendering can operate deterministically without</tspan>
<tspan x="333.00" dy="14.00">depending on external instruction files at runtime.</tspan>
</text>
</g>
</svg>
