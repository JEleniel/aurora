<text class="node-label" x="1129.13" y="228.32" text-anchor="middle" dominant-baseline="middle">
<tspan x="1129.13" font-weight="700">Interface</tspan>
<tspan x="1129.13" dy="14.00" font-weight="700">INT-002</tspan>
<tspan x="1129.13" dy="14.00">&#160;</tspan>
<tspan x="1129.13" dy="14.00">Graphviz DOT Renderer — External executable interface for</tspan>
<tspan x="1129.13" dy="14.00">rendering Graphviz DOT into a layout used to generate themed SVG</tspan>
<tspan x="1129.13" dy="14.00">views (default: 'dot', override via AURORA_DOT_COMMAND).</tspan>
</text>
