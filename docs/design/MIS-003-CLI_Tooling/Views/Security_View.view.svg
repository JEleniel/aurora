<text class="node-label" x="400.16" y="1006.98" text-anchor="middle" dominant-baseline="middle">
<tspan x="400.16" font-weight="700">Actor</tspan>
<tspan x="400.16" dy="14.00" font-weight="700">ACT-003</tspan>
<tspan x="400.16" dy="14.00">&#160;</tspan>
<tspan x="400.16" dy="14.00">Architect — Human operator responsible for authoring Aurora models and</tspan>
<tspan x="400.16" dy="14.00">running CLI tooling (validate, render, compact) to maintain</tspan>
<tspan x="400.16" dy="14.00">deterministic design artifacts.</tspan>
</text>
</g>
<g class="node card-type-component" data-card-id="COM-002" data-layout-node="COM-002">
