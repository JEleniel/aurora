<path class="node-shape node-shape-outline" d="M 106.41 193.32 L 638.41 193.32 L 638.41 333.32" />
<text class="node-icon" x="147.41" y="263.32" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="405.41" y="228.32" text-anchor="middle" dominant-baseline="middle">
<tspan x="405.41" font-weight="700">Component</tspan>
<tspan x="405.41" dy="14.00" font-weight="700">COM-005</tspan>
<tspan x="405.41" dy="14.00">&#160;</tspan>
<tspan x="405.41" dy="14.00">Rendering Engine — Renderer that produces per-card Markdown</tspan>
<tspan x="405.41" dy="14.00">documentation, executive summaries, canonical view DOT sources, and</tspan>
<tspan x="405.41" dy="14.00">themed SVG diagrams; also writes compact agent exports.</tspan>
</text>
</g>
<g class="node card-type-component" data-card-id="COM-006" data-layout-node="COM-006">
<rect class="node-shape" x="119.75" y="-0.05" width="505.33" height="156.00" rx="6.00" ry="6.00" />
<path class="node-shape node-shape-outline" d="M 127.75 7.95 L 617.08 7.95 L 617.08 147.95" />
<text class="node-icon" x="168.75" y="77.95" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="405.41" y="35.95" text-anchor="middle" dominant-baseline="middle">
<tspan x="405.41" font-weight="700">Component</tspan>
<tspan x="405.41" dy="14.00" font-weight="700">COM-006</tspan>
<tspan x="405.41" dy="14.00">&#160;</tspan>
<tspan x="405.41" dy="14.00">Embedded Registries — Compile-time canonical registries for</tspan>
<tspan x="405.41" dy="14.00">card definitions (palette), relationship definitions (matrix</tspan>
<tspan x="405.41" dy="14.00">rules), and view definitions (canonical view set) used by</tspan>
<tspan x="405.41" dy="14.00">validation and rendering.</tspan>
</text>
</g>
