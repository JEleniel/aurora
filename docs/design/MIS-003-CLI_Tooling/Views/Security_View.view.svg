<path class="node-shape node-shape-outline" d="M 122.41 765.32 L 622.41 765.32 L 622.41 905.32" />
<text class="node-icon" x="163.41" y="835.32" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="405.41" y="793.32" text-anchor="middle" dominant-baseline="middle">
<tspan x="405.41" font-weight="700">Component</tspan>
<tspan x="405.41" dy="14.00" font-weight="700">COM-002</tspan>
<tspan x="405.41" dy="14.00">&#160;</tspan>
<tspan x="405.41" dy="14.00">CLI Command Runner — CLI entrypoint and command dispatcher</tspan>
<tspan x="405.41" dy="14.00">(clap subcommands) that orchestrates discovery, validation,</tspan>
<tspan x="405.41" dy="14.00">rendering, and compact export workflows and reports diagnostics</tspan>
<tspan x="405.41" dy="14.00">and summaries.</tspan>
</text>
</g>
<g class="node card-type-component" data-card-id="COM-003" data-layout-node="COM-003">
<rect class="node-shape" x="113.75" y="571.98" width="517.33" height="156.00" rx="6.00" ry="6.00" />
<path class="node-shape node-shape-outline" d="M 121.75 579.98 L 623.08 579.98 L 623.08 719.98" />
<text class="node-icon" x="162.75" y="649.98" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="405.41" y="607.98" text-anchor="middle" dominant-baseline="middle">
<tspan x="405.41" font-weight="700">Component</tspan>
<tspan x="405.41" dy="14.00" font-weight="700">COM-003</tspan>
<tspan x="405.41" dy="14.00">&#160;</tspan>
<tspan x="405.41" dy="14.00">Model Discovery and Loading — Discovery and parsing layer that</tspan>
<tspan x="405.41" dy="14.00">locates model homes (schema-based), loads card files</tspan>
<tspan x="405.41" dy="14.00">(JSON/JSJSON) from disk, and builds a searchable AuroraModel</tspan>
<tspan x="405.41" dy="14.00">index.</tspan>
</text>
</g>
<g class="node card-type-component" data-card-id="COM-004" data-layout-node="COM-004">
<rect class="node-shape" x="118.41" y="371.32" width="508.00" height="170.67" rx="6.00" ry="6.00" />
<path class="node-shape node-shape-outline" d="M 126.41 379.32 L 618.41 379.32 L 618.41 533.99" />
<text class="node-icon" x="167.41" y="456.65" text-anchor="middle" dominant-baseline="middle" font-size="42.00">🧊</text>
<text class="node-label" x="405.41" y="414.65" text-anchor="middle" dominant-baseline="middle">
<tspan x="405.41" font-weight="700">Component</tspan>
<tspan x="405.41" dy="14.00" font-weight="700">COM-004</tspan>
<tspan x="405.41" dy="14.00">&#160;</tspan>
<tspan x="405.41" dy="14.00">Validation Engine — Validator that checks structural</tspan>
<tspan x="405.41" dy="14.00">invariants (duplicate ids, mission presence, link targets,</tspan>
<tspan x="405.41" dy="14.00">reachability) plus policy checks (secret asset ownership) and</tspan>
<tspan x="405.41" dy="14.00">relationship-matrix compliance using embedded registries.</tspan>
</text>
</g>
<g class="node card-type-component" data-card-id="COM-005" data-layout-node="COM-005">
