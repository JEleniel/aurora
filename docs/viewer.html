<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Aurora Viewer — aurora • Midnight</title>
		<link rel="stylesheet" href="assets/css/viewer.css" />
	</head>
	<body>
		<div class="topbar" style="margin-bottom: 0">
			<div class="aurora-left" aria-hidden="true">
				<div class="title">Aurora Viewer</div>
				<div class="muted" style="font-size: 12px">aurora • Midnight</div>
			</div>
			<div class="controls">
				<label for="viewSelect" class="muted">View</label>
				<select id="viewSelect" aria-label="Select view"></select>
				<button id="reloadBtn" class="btn-ghost">Reload</button>
				<button id="openFolder" class="btn-primary">Open Aurora Folder</button>
				<input id="folderInput" type="file" webkitdirectory directory multiple style="display: none" />
				<label style="margin-left: 8px" class="note"
					>Tip: open the Aurora folder or drop it as a directory</label
				>
				<div style="flex: 1"></div>
				<button id="themeToggle" class="btn-ghost">Toggle Theme</button>
			</div>
		</div>

		<main>
			<div id="viewHeader"></div>
			<div id="chartWrap" style="margin-top: 12px; position: relative">
				<div id="chart" class="mermaid">Loading Aurora...</div>
				<div
					id="zoomControls"
					style="position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 40"
				></div>
			</div>
			<div id="legend" class="note">
				Click any node to open card details. Mermaid rendering is used when available.
			</div>
		</main>
		<div id="cardModal" class="modal" role="dialog" aria-modal="true">
			<div class="card-panel" role="document">
				<div class="card-header">
					<div class="card-title" id="modalTitle">Card</div>
					<button class="close-btn" id="modalClose">✕</button>
				</div>
				<div class="card-body">
					<div id="modalMain"></div>
					<div id="modalSide"></div>
				</div>
			</div>
		</div>

		<div class="footer">
			Viewer built to explore Aurora models. Uses Mermaid when available; provide
			<code>mermaid.min.js</code> beside this file to run offline.
		</div>

		<script src="assets/js/viewer.js"></script>
	</body>
</html>
