<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Aurora Editor</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
		<style>
			:root {
				font-family:
					'Inter',
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					Oxygen,
					Ubuntu,
					Cantarell,
					'Open Sans',
					'Helvetica Neue',
					sans-serif;
				color-scheme: dark light;
			}

			body {
				margin: 0;
				display: flex;
				min-height: 100vh;
				align-items: center;
				justify-content: center;
				background: radial-gradient(circle at top, #0f172a, #020617);
				color: #e2e8f0;
			}

			main {
				text-align: center;
				padding: 2rem;
				background: rgba(15, 23, 42, 0.65);
				border-radius: 1.5rem;
				box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.6);
				max-width: 32rem;
			}

			h1 {
				margin-bottom: 0.5rem;
				font-size: 2rem;
			}

			p {
				color: #cbd5f5;
				margin: 0.5rem 0 0;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Aurora Editor</h1>
			<p>The desktop editor is warming up. Launch the app to start modeling.</p>
		</main>
	</body>
</html>
