[package]
name = "aurora_editor"
version = "0.1.0"
edition = "2024"
authors = ["Aurora Contributors <dev@aurora.local>"]
description = "Cross-platform Aurora viewer and editor built with Tauri."
license = "Apache-2.0"
repository = "https://github.com/JEleniel/aurora"
publish = false

[dependencies]
aurora_lib = { path = "../../aurora_lib" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2.5", features = [] }

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
