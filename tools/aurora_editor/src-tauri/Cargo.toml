[package]
name = "aurora_editor"
version = "0.1.0"
edition = "2024"
description = "Tauri backend for the Aurora Editor"
authors = ["Aurora Contributors"]
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
app_id = "org.crystultima.aurora.editor"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
anyhow = "1.0"
aurora_shared = { path = "../../aurora_shared" }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.3", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
