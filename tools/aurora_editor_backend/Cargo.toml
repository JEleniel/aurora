[package]
name = "aurora_editor_backend"
version = "0.1.0"
edition = "2024"
authors = ["Aurora Architects"]
description = "Backend service layer for the Aurora desktop editor"
license = "MIT OR Apache-2.0"
build = "build.rs"

[package.metadata]
app_id = "org.crystultima.aurora.editor"

[dependencies]
aurora_shared = { path = "../aurora_shared" }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.5", features = ["shell-open"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
