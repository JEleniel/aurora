[package]
name = "aurora_cli"
version = "0.1.0"
edition = "2024"
description = "CLI utilities for validating Aurora models and generating documentation"
license = "MIT-or-Apache-2.0"

[package.metadata]
app_id = "org.crystultima.aurora_cli"

[[bin]]
name = "aurora_cli"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
indexmap = "2.2"
jsonschema = "0.17"
pathdiff = "0.2"
percent-encoding = "2.3"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
walkdir = "2.5"
whoami = "1.6"

[dev-dependencies]
tempfile = "3.10"
