[package]
name = "aurora_cli"
version = "0.1.0"
edition = "2024"
authors = ["Aurora Architects"]
description = "Aurora command-line interface"
license = "MIT OR Apache-2.0"

[[bin]]
name = "aurora_cli"
path = "src/main.rs"

[package.metadata]
app_id = "org.crystultima.aurora.cli"

[dependencies]
aurora_shared = { path = "../aurora_shared" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde_json = "1.0"
