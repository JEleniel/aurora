[package]
name = "aurora_cli"
description = "Aurora command-line interface"
edition = "2024"
version = "1.0.0"
repository = "https://github.com/JEleniel/aurora"
license = "MIT OR Apache-2.0"
keywords = [
	"architecture",
	"design",
	"documentation",
	"diagram",
	"flowchart",
	"modeling",
	"UML",
	"SysML",
	"DSL",
]
categories = [
	"development-tools::documentation",
	"development-tools::diagramming",
]
publish = false

[[bin]]
name = "aurora_cli"
path = "src/main.rs"

[package.metadata]
app_id = "org.crystultima.aurora.cli"

[dependencies]
aurora_shared = { path = "../aurora_shared" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde_json = "1.0"
env = "1.0.1"

[lints.rust]
unsafe_code = "forbid"
