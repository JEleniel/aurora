[workspace]
members = ["tools/*"]
resolver = "3"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "string", "unicode"] }
fern = { version = "0.7.1", features = ["date-based", "colored"] }
indexmap = { version = "2.2", features = ["serde"] }
jsonschema = { version = "0.40" }
log = { version = "0.4.29", features = ["serde"] }
pathdiff = { version = "0.2" }
percent-encoding = { version = "2.3" }
regex = { version = "1.12" }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = { version = "1.0" }
whoami = { version = "2", default-features = false, features = [
	"std",
	"wasi-wasite",
] }
