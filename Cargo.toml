[workspace]
members = ["tools/aurora_cli", "tools/aurora_shared"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.0"
repository = "https://github.com/JEleniel/aurora"
license = "MIT OR Apache-2.0"
keywords = [
	"architecture",
	"design",
	"documentation",
	"diagram",
	"flowchart",
	"modeling",
	"UML",
	"SysML",
	"DSL",
]
categories = [
	"development-tools::documentation",
	"development-tools::diagramming",
]
publish = false

[workspace.package.metadata]
publisher = "org.crystultima"

[workspace.dependencies]
